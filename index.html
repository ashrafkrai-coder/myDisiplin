<!doctype html>
<html class="ios-ui" lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f2744" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="myDisiplin" />
  <meta name="msapplication-config" content="browserconfig.xml" />
  <meta name="msapplication-TileColor" content="#0f2744" />
  <script src="assets/auth.js"></script>
  <script>
    if (window.myDisiplinAuth) window.myDisiplinAuth.requireAuth();
  </script>
  <title>myDisiplin</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/theme.css" />
  <link rel="icon" href="icons/icon32.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon180.png" />
  <style>

    /* ── Section Card ── */
    .search-panel {
      background: var(--ios-surface);
      border-radius: var(--ios-radius);
      box-shadow: var(--ios-shadow);
      padding: 0;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .search-panel h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--ios-label3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 14px 16px 0;
    }

    /* ── Search Grid ── */
    .search-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      padding: 10px 16px 0;
    }

    .search-grid input {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--ios-separator);
      border-radius: 0;
      padding: 13px 0;
      font: var(--fs-input)/1 var(--font);
      color: var(--ios-label);
      background: transparent;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .search-grid input:last-of-type {
      border-bottom: none;
    }

    .search-grid input::placeholder {
      color: var(--ios-label4);
    }

    .search-grid input:focus {
      background: rgba(0,122,255,0.04);
    }

    .search-grid button[type="submit"] {
      display: block;
      width: calc(100% - 32px);
      margin: 14px 16px 16px;
      padding: 14px;
      background: var(--ios-accent);
      color: #fff;
      border: none;
      border-radius: var(--ios-radius-sm);
      font: var(--fs-btn)/1 var(--font);
      font-weight: 600;
      letter-spacing: -0.2px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.10s;
      -webkit-appearance: none;
    }

    .search-grid button[type="submit"]:active {
      opacity: 0.75;
      transform: scale(0.98);
    }

    /* ── Search Result ── */
    .search-result {
      padding: 14px 16px;
      border-top: 1px solid var(--ios-separator);
    }

    .search-result > p {
      margin: 0;
      font-size: var(--fs-body);
      color: var(--ios-label3);
      text-align: center;
    }

    /* ── Student Cards ── */
    .student-item {
      background: var(--ios-surface);
      border-radius: var(--ios-radius);
      box-shadow: var(--ios-shadow);
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid var(--ios-teal);
    }

    .student-head {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

    .student-initials {
      flex: 0 0 auto;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--ios-accent-soft);
      color: var(--ios-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
    }

    .student-head-text {
      min-width: 0;
    }

    .student-meta {
      margin: 0;
      font-size: 13px;
      color: var(--ios-label3);
      overflow-wrap: anywhere;
    }

    .student-title {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 700;
      color: var(--ios-label);
      letter-spacing: -0.2px;
    }

    .student-item > p {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--ios-label3);
    }

    .student-item > p > strong {
      color: var(--ios-label2);
      font-weight: 600;
    }

    .case-list {
      margin: 6px 0 0 0;
      padding: 0;
      list-style: none;
    }

    .case-list li {
      font-size: 13px;
      color: var(--ios-label2);
      padding: 7px 10px;
      background: var(--ios-fill2);
      border-radius: var(--ios-radius-xs);
      margin-bottom: 5px;
      line-height: 1.4;
    }

    .case-empty {
      font-size: 13px;
      color: var(--ios-green);
      font-weight: 500;
      margin: 4px 0 0;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .case-empty::before {
      content: '✓';
      font-size: 11px;
      background: var(--ios-green);
      color: #fff;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .student-actions {
      margin-top: 12px;
    }

    .add-record-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ios-accent);
      background: var(--ios-accent-soft);
      border-radius: 20px;
      text-decoration: none;
      transition: background 0.15s, transform 0.10s;
      letter-spacing: -0.1px;
    }

    .add-record-link::before {
      content: '+';
      font-size: 18px;
      font-weight: 400;
      line-height: 1;
    }

    .add-record-link:active {
      background: rgba(0,122,255,0.16);
      transform: scale(0.97);
    }

    /* ── Bottom Actions ── */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 4px 0 20px;
    }

    .actions button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: var(--ios-radius-sm);
      font: var(--fs-btn)/1 var(--font);
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.10s;
      -webkit-appearance: none;
      letter-spacing: -0.2px;
    }

    .actions button:first-child {
      background: var(--ios-accent);
      color: #fff;
      box-shadow: var(--shadow-accent);
    }

    .actions button.secondary {
      background: var(--ios-surface);
      color: var(--ios-red);
      box-shadow: var(--ios-shadow);
    }

    .actions button:active {
      opacity: 0.70;
      transform: scale(0.98);
    }

    .install-status {
      margin: -8px 0 20px;
      font-size: 14px;
      color: var(--ios-label3);
      text-align: center;
    }
    .install-status:empty { display: none; }

    code {
      background: var(--ios-fill);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 13px;
    }
  </style>
<link rel="stylesheet" href="assets/dark.css" /><script src="assets/theme-toggle.js"></script>
<link rel="stylesheet" href="assets/app-header.css" /><script src="assets/app-header.js" defer></script>
<link rel="stylesheet" href="assets/desktop.css" />
</head>
<body>
  <main>
    <div class="hero">
      <img
        class="hero-logo"
        src="icons/logo-sekolah.png"
        alt="Logo myDisiplin"
      />
      <div class="hero-text">
        <h1>myDisiplin</h1>
        <p>Aplikasi Lembaga Disiplin dan Pengawas Smk Taman Medan untuk rekod dan carian kes.</p>
      </div>
    </div>
    <div class="quick-links">
      <a href="rekod-kes-baru.html">Rekod Kes Baru</a>
      <a href="senarai-kes.html">Senarai Kes</a>
      <a href="dashbord.html">Dashbord</a>
      <a href="profil-murid.html">Profil Murid</a>
    </div>
    <section class="search-panel" id="carian-murid">
      <h2>Carian Nama Murid</h2>
      <form id="student-search-form" class="search-grid">
        <input id="student-name" type="text" aria-label="Nama pelajar" autocomplete="off" placeholder="Masukkan nama pelajar" />
        <input id="student-nokp" type="text" aria-label="No kad pengenalan" inputmode="numeric" autocomplete="off" placeholder="Masukkan no kp" />
        <input id="student-class" type="text" aria-label="Kelas" autocomplete="off" placeholder="Masukkan kelas" />
        <button type="submit">Cari Pelajar</button>
      </form>
      <div id="search-output" class="search-result">
        <p>Sila masukkan maklumat pelajar untuk membuat carian.</p>
      </div>
    </section>
    <div class="actions">
      <button id="install-btn">Pasang Aplikasi</button>
      <button id="refresh-btn" class="secondary" hidden>Muat Semula Versi Baharu</button>
    </div>
    <p id="install-status" class="install-status" role="status" aria-live="polite"></p>
  </main>

  <script>
    (() => {
      const swStatusEl = document.getElementById("sw-status");
      const installStatusEl = document.getElementById("install-status");
      const installBtn = document.getElementById("install-btn");
      const refreshBtn = document.getElementById("refresh-btn");
      const studentSearchForm = document.getElementById("student-search-form");
      const studentNameInput = document.getElementById("student-name");
      const studentNoKpInput = document.getElementById("student-nokp");
      const studentClassInput = document.getElementById("student-class");
      const searchOutput = document.getElementById("search-output");
      const setInstallStatus = (message) => {
        if (installStatusEl) installStatusEl.textContent = message;
      };
      const setSwStatus = (message) => {
        if (swStatusEl) swStatusEl.textContent = message;
      };
      let deferredPrompt;
      const SHEET_TAB = "data";
      const CASES_TAB = "Rekod kes baru";
      let students = [];
      let caseRecords = [];

      function normalizeKey(value) {
        return String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
      }

      function findColumnIndex(headers, aliases) {
        return headers.findIndex((header) => aliases.includes(normalizeKey(header)));
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function normalizeName(value) {
        return String(value || "").trim().toLowerCase().replace(/\s+/g, " ");
      }

      function formatTarikhDisplay(value) {
        const raw = String(value == null ? "" : value).trim();
        if (!raw) return "-";

        const gviz = raw.match(/^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/i);
        if (gviz) {
          const year = Number(gviz[1]);
          const month = Number(gviz[2]) + 1;
          const day = Number(gviz[3]);
          const dd = String(day).padStart(2, "0");
          const mm = String(month).padStart(2, "0");
          return `${dd}/${mm}/${year}`;
        }

        const iso = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
        if (iso) {
          const dd = String(Number(iso[3])).padStart(2, "0");
          const mm = String(Number(iso[2])).padStart(2, "0");
          return `${dd}/${mm}/${iso[1]}`;
        }

        const malay = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (malay) {
          const dd = String(Number(malay[1])).padStart(2, "0");
          const mm = String(Number(malay[2])).padStart(2, "0");
          return `${dd}/${mm}/${malay[3]}`;
        }

        const native = new Date(raw);
        if (!Number.isNaN(native.getTime())) {
          const dd = String(native.getDate()).padStart(2, "0");
          const mm = String(native.getMonth() + 1).padStart(2, "0");
          const yyyy = native.getFullYear();
          return `${dd}/${mm}/${yyyy}`;
        }

        return raw.replace(/^Date/i, "").trim() || "-";
      }

      function buildAddRecordUrl(student) {
        const params = new URLSearchParams();
        params.set("nama", student.nama || "");
        params.set("nokp", student.noKp || "");
        params.set("kelas", student.kelas || "");
        return `rekod-kes-baru.html?${params.toString()}`;
      }

      function renderStudents(list) {
        if (!list.length) {
          searchOutput.innerHTML = "<p>Tiada pelajar dijumpai untuk carian ini.</p>";
          return;
        }

        searchOutput.innerHTML = list
          .map((student) => {
            const studentNameKey = normalizeName(student.nama);
            const matchedCases = caseRecords.filter((item) => normalizeName(item.nama) === studentNameKey);

            const caseHtml = matchedCases.length
              ? `<ul class="case-list">${matchedCases.map((item) => `
                  <li>${escapeHtml(formatTarikhDisplay(item.tarikh))} | ${escapeHtml(item.kategori || "-")} | ${escapeHtml(item.status || "-")} | ${escapeHtml(item.catatan || "-")}</li>
                `).join("")}</ul>`
              : `<p class="case-empty">Tiada rekod kesalahan.</p>`;

            return `
              <div class="student-item">
                <div class="student-head">
                  <span class="student-initials" aria-hidden="true">${escapeHtml(initials(student.nama))}</span>
                  <div class="student-head-text">
                    <p class="student-title">${escapeHtml(student.nama || "-")}</p>
                    <p class="student-meta">No KP: ${escapeHtml(student.noKp || "-")} | Kelas: ${escapeHtml(student.kelas || "-")}</p>
                  </div>
                </div>
                <p><strong>Rekod Kesalahan:</strong></p>
                ${caseHtml}
                <div class="student-actions">
                  <a class="add-record-link" href="${escapeHtml(buildAddRecordUrl(student))}">Tambah Rekod Baru</a>
                  <a class="add-record-link" href="profil-murid.html?murid=${encodeURIComponent(icKey(student.noKp))}">Lihat Profil Murid</a>
                </div>
              </div>
            `;
          })
          .join("");
      }

      function icKey(noKp) {
        const digits = String(noKp || "").replace(/[^0-9]/g, "");
        return digits ? digits.padStart(12, "0") : "";
      }

      function initials(name) {
        return String(name || "").trim().split(/\s+/).slice(0, 2).map((part) => part.charAt(0)).join("").toUpperCase() || "?";
      }

      async function loadStudentsFromSheet() {
        searchOutput.innerHTML = "<p>Memuat data pelajar...</p>";

        try {
          const table = await window.myDisiplinAuth.sheetTable(SHEET_TAB);
          const rows = table.rows;
          const headers = table.headers;

          const nameCol = findColumnIndex(headers, ["nama", "namamurid", "murid", "namapelajar"]);
          const noKpCol = findColumnIndex(headers, ["nokp", "nokadpengenalan", "ic", "nokad"]);
          const classCol = findColumnIndex(headers, ["kelas", "class", "tingkatan"]);

          students = rows
            .map((row) => (row.c || []).map((cell) => (cell && cell.v != null ? String(cell.v) : "")))
            .map((cells) => ({
              nama: nameCol >= 0 ? cells[nameCol] || "" : "",
              noKp: noKpCol >= 0 ? cells[noKpCol] || "" : "",
              kelas: classCol >= 0 ? cells[classCol] || "" : ""
            }))
            .filter((student) => student.nama || student.noKp || student.kelas);

          if (!students.length) {
            searchOutput.innerHTML = "<p>Data dijumpai tetapi tiada rekod pelajar yang sah.</p>";
            return;
          }

          searchOutput.innerHTML = "<p>Sila masukkan maklumat pelajar untuk membuat carian.</p>";
        } catch (error) {
          searchOutput.innerHTML = `<p>Gagal memuat data pelajar: ${escapeHtml(error.message)}</p>`;
        }
      }

      async function loadCaseRecordsFromSheet() {
        try {
          const table = await window.myDisiplinAuth.sheetTable(CASES_TAB);
          const rows = table.rows;
          const headers = table.headers;

          const namaCol = findColumnIndex(headers, ["nama", "namamurid", "murid", "namapelajar"]);
          const tarikhCol = findColumnIndex(headers, ["tarikh", "date"]);
          const kategoriCol = findColumnIndex(headers, ["kategori", "jeniskesalahan", "jenis"]);
          const statusCol = findColumnIndex(headers, ["status"]);
          const catatanCol = findColumnIndex(headers, ["catatan", "butiran", "keterangan"]);

          caseRecords = rows
            .map((row) => (row.c || []).map((cell) => (cell && cell.v != null ? String(cell.v) : "")))
            .map((cells) => ({
              nama: namaCol >= 0 ? cells[namaCol] || "" : "",
              tarikh: tarikhCol >= 0 ? cells[tarikhCol] || "" : "",
              kategori: kategoriCol >= 0 ? cells[kategoriCol] || "" : "",
              status: statusCol >= 0 ? cells[statusCol] || "" : "",
              catatan: catatanCol >= 0 ? cells[catatanCol] || "" : ""
            }))
            .filter((item) => item.nama);
        } catch {
          caseRecords = [];
        }
      }

      studentSearchForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const nameQuery = studentNameInput.value.trim().toLowerCase();
        const noKpQuery = studentNoKpInput.value.trim().toLowerCase();
        const classQuery = studentClassInput.value.trim().toLowerCase();

        if (!students.length) {
          searchOutput.innerHTML = "<p>Data pelajar belum dimuat. Sila tunggu sebentar dan cuba lagi.</p>";
          return;
        }

        const filtered = students.filter((student) => {
          const matchName = !nameQuery || student.nama.toLowerCase().includes(nameQuery);
          const matchNoKp = !noKpQuery || student.noKp.toLowerCase().includes(noKpQuery);
          const matchClass = !classQuery || student.kelas.toLowerCase().includes(classQuery);
          return matchName && matchNoKp && matchClass;
        });
        renderStudents(filtered);
      });

      Promise.all([loadStudentsFromSheet(), loadCaseRecordsFromSheet()]).catch(() => {});

      // Once installed (or when already running as the installed app) the install button is not needed.
      const hideInstall = () => {
        installBtn.hidden = true;
        installBtn.style.display = "none";
        setInstallStatus("");
      };
      const isInstalledApp = () =>
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: window-controls-overlay)").matches ||
        window.navigator.standalone === true;
      if (isInstalledApp()) hideInstall();

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredPrompt = event;
        setInstallStatus("");
      });

      installBtn.addEventListener("click", async () => {
        if (!deferredPrompt) {
          const ua = navigator.userAgent || "";
          const isIOS = /iPad|iPhone|iPod/i.test(ua);
          const isAndroid = /Android/i.test(ua);
          if (isIOS) {
            setInstallStatus("iPhone/iPad: tekan butang Kongsi, kemudian pilih Tambah ke Skrin Utama.");
          } else if (isAndroid) {
            setInstallStatus("Android: buka menu pelayar (⋮), kemudian pilih Pasang aplikasi atau Tambah ke skrin utama.");
          } else {
            setInstallStatus("Jika tiada tetingkap pemasangan, buka menu pelayar dan pilih Pasang aplikasi.");
          }
          return;
        }
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (choice && choice.outcome === "accepted") hideInstall();
        else setInstallStatus("Pemasangan dibatalkan.");
      });

      window.addEventListener("appinstalled", () => {
        deferredPrompt = null;
        hideInstall();
      });

      if (!("serviceWorker" in navigator)) {
        setSwStatus("pelayar tidak menyokong");
        return;
      }

      navigator.serviceWorker.register("sw.js").then((registration) => {
        setSwStatus("aktif");

        if (registration.waiting) {
          refreshBtn.hidden = false;
          setSwStatus("kemas kini tersedia");
        }

        registration.addEventListener("updatefound", () => {
          const newWorker = registration.installing;
          if (!newWorker) return;

          newWorker.addEventListener("statechange", () => {
            if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
              refreshBtn.hidden = false;
              setSwStatus("kemas kini sedia");
            }
          });
        });

        setInterval(() => registration.update(), 60000);
      }).catch((error) => {
        setSwStatus(`gagal: ${error.message}`);
      });

      refreshBtn.addEventListener("click", () => {
        window.location.reload();
      });

    })();
  </script>
</body>
</html>
