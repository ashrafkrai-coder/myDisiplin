<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="myDisiplin" />
  <meta name="msapplication-config" content="browserconfig.xml" />
  <meta name="msapplication-TileColor" content="#0f766e" />
  <script src="assets/auth.js"></script>
  <script>
    if (window.myDisiplinAuth) window.myDisiplinAuth.requireAuth();
  </script>
  <title>myDisiplin</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/theme.css" />
  <link rel="icon" href="icons/icon32.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon180.png" />
  <style>
    /* ── iPhone-look Design System ── */
    :root {
      --ios-bg: #f2f2f7;
      --ios-surface: #ffffff;
      --ios-surface2: rgba(255,255,255,0.72);
      --ios-separator: rgba(60,60,67,0.12);
      --ios-label: #1c1c1e;
      --ios-label2: #3a3a3c;
      --ios-label3: #636366;
      --ios-label4: #8e8e93;
      --ios-accent: #007aff;
      --ios-teal: #30b0c7;
      --ios-green: #34c759;
      --ios-red: #ff3b30;
      --ios-orange: #ff9500;
      --ios-purple: #af52de;
      --ios-fill: rgba(120,120,128,0.12);
      --ios-fill2: rgba(120,120,128,0.08);
      --ios-blur: blur(24px) saturate(180%);
      --ios-radius: 16px;
      --ios-radius-sm: 10px;
      --ios-radius-xs: 8px;
      --ios-shadow: 0 2px 12px rgba(0,0,0,0.06), 0 0 1px rgba(0,0,0,0.08);
      --ios-shadow-md: 0 4px 24px rgba(0,0,0,0.10), 0 1px 3px rgba(0,0,0,0.06);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--ios-bg);
      color: var(--ios-label);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }

    main {
      width: min(430px, 100%);
      margin: 0 auto;
      padding: 12px 16px 40px;
    }

    /* ── Status Bar Spacer ── */
    body::before {
      content: '';
      display: block;
      height: env(safe-area-inset-top, 0px);
    }

    /* ── Hero / App Header ── */
    .hero {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 18px;
      border-radius: 24px;
      background: linear-gradient(145deg, #1c1c2e 0%, #0f2744 50%, #0a3d62 100%);
      box-shadow: 0 8px 32px rgba(0,0,0,0.28), 0 2px 8px rgba(0,0,0,0.20);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Subtle gloss overlay */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, transparent 60%);
      pointer-events: none;
      border-radius: inherit;
    }

    /* Accent glow blob */
    .hero::after {
      content: '';
      position: absolute;
      bottom: -30px;
      right: -20px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(0,122,255,0.35) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-logo {
      width: 58px;
      height: 58px;
      object-fit: contain;
      flex: 0 0 auto;
      order: 2;
      margin-left: auto;
      border-radius: 14px;
      background: rgba(255,255,255,0.10);
      padding: 4px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.30));
    }

    .hero-text {
      flex: 1 1 auto;
      min-width: 0;
      order: 1;
      position: relative;
      z-index: 1;
    }

    .hero-text h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      line-height: 1.1;
    }

    .hero-text p {
      margin: 5px 0 0;
      font-size: 12px;
      font-weight: 400;
      color: rgba(255,255,255,0.60);
      line-height: 1.4;
    }

    p { line-height: 1.5; }

    /* ── Quick Links (iOS Tab Row) ── */
    .quick-links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .quick-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 13px 10px;
      background: var(--ios-surface);
      border-radius: var(--ios-radius-sm);
      font-size: 13px;
      font-weight: 600;
      color: var(--ios-accent);
      text-decoration: none;
      box-shadow: var(--ios-shadow);
      transition: background 0.15s, transform 0.10s, box-shadow 0.15s;
      line-height: 1.3;
      letter-spacing: -0.1px;
    }

    .quick-links a:active {
      background: rgba(0,122,255,0.08);
      transform: scale(0.97);
      box-shadow: none;
    }

    /* ── Section Card ── */
    .search-panel {
      background: var(--ios-surface);
      border-radius: var(--ios-radius);
      box-shadow: var(--ios-shadow);
      padding: 0;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .search-panel h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--ios-label3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 14px 16px 0;
    }

    /* ── Search Grid ── */
    .search-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      padding: 10px 16px 0;
    }

    .search-grid input {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--ios-separator);
      border-radius: 0;
      padding: 13px 0;
      font: 17px/1 var(--font);
      color: var(--ios-label);
      background: transparent;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .search-grid input:last-of-type {
      border-bottom: none;
    }

    .search-grid input::placeholder {
      color: var(--ios-label4);
    }

    .search-grid input:focus {
      background: rgba(0,122,255,0.04);
    }

    .search-grid button[type="submit"] {
      display: block;
      width: calc(100% - 32px);
      margin: 14px 16px 16px;
      padding: 14px;
      background: var(--ios-accent);
      color: #fff;
      border: none;
      border-radius: var(--ios-radius-sm);
      font: 17px/1 var(--font);
      font-weight: 600;
      letter-spacing: -0.2px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.10s;
      -webkit-appearance: none;
    }

    .search-grid button[type="submit"]:active {
      opacity: 0.75;
      transform: scale(0.98);
    }

    /* ── Search Result ── */
    .search-result {
      padding: 14px 16px;
      border-top: 1px solid var(--ios-separator);
    }

    .search-result > p {
      margin: 0;
      font-size: 15px;
      color: var(--ios-label3);
      text-align: center;
    }

    /* ── Student Cards ── */
    .student-item {
      background: var(--ios-surface);
      border-radius: var(--ios-radius);
      box-shadow: var(--ios-shadow);
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid var(--ios-teal);
    }

    .student-head {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

    .student-photo {
      flex: 0 0 auto;
      width: 72px;
      height: 72px;
      border-radius: 14px;
      object-fit: cover;
      background: var(--ios-fill);
      color: var(--ios-label3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
    }

    .student-head-text {
      min-width: 0;
    }

    .student-meta {
      margin: 0;
      font-size: 13px;
      color: var(--ios-label3);
      overflow-wrap: anywhere;
    }

    .photo-hint {
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--ios-label3);
    }

    .photo-hint button {
      font: inherit;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--ios-separator);
      background: var(--ios-surface);
      color: var(--ios-accent);
      font-weight: 600;
      cursor: pointer;
    }

    .student-title {
      margin: 0 0 4px;
      font-size: 17px;
      font-weight: 700;
      color: var(--ios-label);
      letter-spacing: -0.2px;
    }

    .student-item > p {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--ios-label3);
    }

    .student-item > p > strong {
      color: var(--ios-label2);
      font-weight: 600;
    }

    .case-list {
      margin: 6px 0 0 0;
      padding: 0;
      list-style: none;
    }

    .case-list li {
      font-size: 13px;
      color: var(--ios-label2);
      padding: 7px 10px;
      background: var(--ios-fill2);
      border-radius: var(--ios-radius-xs);
      margin-bottom: 5px;
      line-height: 1.4;
    }

    .case-empty {
      font-size: 13px;
      color: var(--ios-green);
      font-weight: 500;
      margin: 4px 0 0;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .case-empty::before {
      content: '✓';
      font-size: 11px;
      background: var(--ios-green);
      color: #fff;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .student-actions {
      margin-top: 12px;
    }

    .add-record-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ios-accent);
      background: rgba(0,122,255,0.08);
      border-radius: 20px;
      text-decoration: none;
      transition: background 0.15s, transform 0.10s;
      letter-spacing: -0.1px;
    }

    .add-record-link::before {
      content: '+';
      font-size: 18px;
      font-weight: 400;
      line-height: 1;
    }

    .add-record-link:active {
      background: rgba(0,122,255,0.16);
      transform: scale(0.97);
    }

    /* ── Bottom Actions ── */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 4px 0 20px;
    }

    .actions button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: var(--ios-radius-sm);
      font: 17px/1 var(--font);
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.10s;
      -webkit-appearance: none;
      letter-spacing: -0.2px;
    }

    .actions button:first-child {
      background: var(--ios-accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(0,122,255,0.30);
    }

    .actions button.secondary {
      background: var(--ios-surface);
      color: var(--ios-red);
      box-shadow: var(--ios-shadow);
    }

    .actions button:active {
      opacity: 0.70;
      transform: scale(0.98);
    }

    button[hidden] { display: none; }

    code {
      background: var(--ios-fill);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 13px;
    }

    /* ── Responsive ── */
    @media (min-width: 431px) {
      main {
        padding-top: 24px;
        padding-bottom: 60px;
      }
    }

    @media (max-width: 390px) {
      .hero-text h1 { font-size: 22px; }
      .quick-links a { font-size: 12px; padding: 11px 8px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <img
        class="hero-logo"
        src="icons/logo-sekolah.png"
        alt="Logo myDisiplin"
      />
      <div class="hero-text">
        <h1>myDisiplin</h1>
        <p>Aplikasi Lembaga Disiplin dan Pengawas Smk Taman Medan untuk rekod dan carian kes.</p>
      </div>
    </div>
    <div class="quick-links">
      <a href="index.html#carian-murid">Carian Nama Murid</a>
      <a href="rekod-kes-baru.html">Rekod Kes Baru</a>
      <a href="senarai-kes.html">Senarai Kes</a>
      <a href="dashbord.html">Dashbord</a>
    </div>
    <a class="add-record-link" href="profil-murid.html">Profil &amp; Foto Murid</a>
    <section class="search-panel" id="carian-murid">
      <h2>Carian Nama Murid</h2>
      <form id="student-search-form" class="search-grid">
        <input id="student-name" type="text" placeholder="Masukkan nama pelajar" />
        <input id="student-nokp" type="text" placeholder="Masukkan no kp" />
        <input id="student-class" type="text" placeholder="Masukkan kelas" />
        <button type="submit">Cari Pelajar</button>
      </form>
      <div id="search-output" class="search-result">
        <p>Sila masukkan maklumat pelajar untuk membuat carian.</p>
      </div>
    </section>
    <div class="actions">
      <button id="install-btn">Install Aplikasi</button>
      <button id="logout-btn" class="secondary">Log Keluar</button>
      <button id="refresh-btn" class="secondary" hidden>Muat Ulang Update</button>
    </div>
  </main>

  <script>
    (() => {
      const swStatusEl = document.getElementById("sw-status");
      const installStatusEl = document.getElementById("install-status");
      const installBtn = document.getElementById("install-btn");
      const logoutBtn = document.getElementById("logout-btn");
      const refreshBtn = document.getElementById("refresh-btn");
      const studentSearchForm = document.getElementById("student-search-form");
      const studentNameInput = document.getElementById("student-name");
      const studentNoKpInput = document.getElementById("student-nokp");
      const studentClassInput = document.getElementById("student-class");
      const searchOutput = document.getElementById("search-output");
      const setInstallStatus = (message) => {
        if (installStatusEl) installStatusEl.textContent = message;
      };
      const setSwStatus = (message) => {
        if (swStatusEl) swStatusEl.textContent = message;
      };
      let deferredPrompt;
      setInstallStatus("tekan butang Install Aplikasi");
      const SHEET_ID = "1n3_wQUNOO1iW8mFc-etoncKfuda4Ce94pusKv6s2vRs";
      const SHEET_TAB = "data";
      const CASES_TAB = "Rekod kes baru";
      let students = [];
      let caseRecords = [];

      function normalizeKey(value) {
        return String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
      }

      function findColumnIndex(headers, aliases) {
        return headers.findIndex((header) => aliases.includes(normalizeKey(header)));
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function normalizeName(value) {
        return String(value || "").trim().toLowerCase().replace(/\s+/g, " ");
      }

      function formatTarikhDisplay(value) {
        const raw = String(value == null ? "" : value).trim();
        if (!raw) return "-";

        const gviz = raw.match(/^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/i);
        if (gviz) {
          const year = Number(gviz[1]);
          const month = Number(gviz[2]) + 1;
          const day = Number(gviz[3]);
          const dd = String(day).padStart(2, "0");
          const mm = String(month).padStart(2, "0");
          return `${dd}/${mm}/${year}`;
        }

        const iso = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
        if (iso) {
          const dd = String(Number(iso[3])).padStart(2, "0");
          const mm = String(Number(iso[2])).padStart(2, "0");
          return `${dd}/${mm}/${iso[1]}`;
        }

        const malay = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (malay) {
          const dd = String(Number(malay[1])).padStart(2, "0");
          const mm = String(Number(malay[2])).padStart(2, "0");
          return `${dd}/${mm}/${malay[3]}`;
        }

        const native = new Date(raw);
        if (!Number.isNaN(native.getTime())) {
          const dd = String(native.getDate()).padStart(2, "0");
          const mm = String(native.getMonth() + 1).padStart(2, "0");
          const yyyy = native.getFullYear();
          return `${dd}/${mm}/${yyyy}`;
        }

        return raw.replace(/^Date/i, "").trim() || "-";
      }

      function buildAddRecordUrl(student) {
        const params = new URLSearchParams();
        params.set("nama", student.nama || "");
        params.set("nokp", student.noKp || "");
        params.set("kelas", student.kelas || "");
        return `rekod-kes-baru.html?${params.toString()}`;
      }

      function renderStudents(list) {
        if (!list.length) {
          searchOutput.innerHTML = "<p>Tiada pelajar dijumpai untuk carian ini.</p>";
          return;
        }

        const hint = photoToken()
          ? ""
          : '<p class="photo-hint">Foto murid tidak dipaparkan. <button type="button" data-act="photo-token">Masukkan kod akses foto</button></p>';
        searchOutput.innerHTML = hint + list
          .map((student) => {
            const studentNameKey = normalizeName(student.nama);
            const matchedCases = caseRecords.filter((item) => normalizeName(item.nama) === studentNameKey);

            const caseHtml = matchedCases.length
              ? `<ul class="case-list">${matchedCases.map((item) => `
                  <li>${escapeHtml(formatTarikhDisplay(item.tarikh))} | ${escapeHtml(item.kategori || "-")} | ${escapeHtml(item.status || "-")} | ${escapeHtml(item.catatan || "-")}</li>
                `).join("")}</ul>`
              : `<p class="case-empty">Tiada rekod kesalahan.</p>`;

            return `
              <div class="student-item">
                <div class="student-head">
                  <span class="student-photo" data-nokp="${escapeHtml(photoKey(student.noKp))}" aria-hidden="true">${escapeHtml(initials(student.nama))}</span>
                  <div class="student-head-text">
                    <p class="student-title">${escapeHtml(student.nama || "-")}</p>
                    <p class="student-meta">No KP: ${escapeHtml(student.noKp || "-")} | Kelas: ${escapeHtml(student.kelas || "-")}</p>
                  </div>
                </div>
                <p><strong>Rekod Kesalahan:</strong></p>
                ${caseHtml}
                <div class="student-actions">
                  <a class="add-record-link" href="${escapeHtml(buildAddRecordUrl(student))}">Tambah Rekod Baru</a>
                  <a class="add-record-link" href="profil-murid.html">Urus Foto Profil</a>
                </div>
              </div>
            `;
          })
          .join("");
        loadPhotos();
      }

      // ── Student photos (private; fetched with the photo access code) ──
      const PHOTO_ENDPOINT = "https://script.google.com/macros/s/AKfycbxEt9OP-SO8k6VquhFT0wrRRWM26-ohEk9hzdiR68EAG4FjmnmqM1mUfHqzjkByEOu7/exec";
      const PHOTO_TOKEN_KEY = "mydisiplin_photo_token";
      const photoCache = {};
      const photoPending = new Set();

      function photoToken() {
        try { return sessionStorage.getItem(PHOTO_TOKEN_KEY) || ""; } catch (e) { return ""; }
      }

      function photoKey(noKp) {
        const digits = String(noKp || "").replace(/[^0-9]/g, "");
        return digits ? digits.padStart(12, "0") : "";
      }

      function initials(name) {
        return String(name || "").trim().split(/s+/).slice(0, 2).map((part) => part.charAt(0)).join("").toUpperCase() || "?";
      }

      function showPhoto(el, src) {
        const img = document.createElement("img");
        img.className = "student-photo";
        img.alt = "";
        img.src = src;
        img.dataset.nokp = el.dataset.nokp;
        el.replaceWith(img);
      }

      function applyPhotos() {
        searchOutput.querySelectorAll("span.student-photo[data-nokp]").forEach((el) => {
          const src = photoCache[el.dataset.nokp];
          if (src) showPhoto(el, src);
        });
      }

      async function loadPhotos() {
        const token = photoToken();
        if (!token) return;
        const wanted = Array.from(searchOutput.querySelectorAll("span.student-photo[data-nokp]"))
          .map((el) => el.dataset.nokp)
          .filter((id) => id && !(id in photoCache) && !photoPending.has(id));
        const ids = Array.from(new Set(wanted));
        ids.forEach((id) => photoPending.add(id));
        applyPhotos();
        for (let i = 0; i < ids.length; i += 8) {
          const noKps = ids.slice(i, i + 8);
          fetch(PHOTO_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "photo_batch", photoToken: token, noKps })
          })
            .then((response) => response.json())
            .then((result) => {
              if (!result.ok) throw new Error(result.error || "photo_batch gagal");
              noKps.forEach((id) => { photoCache[id] = (result.photos && result.photos[id]) || ""; });
              applyPhotos();
            })
            .catch(() => {})
            .finally(() => noKps.forEach((id) => photoPending.delete(id)));
        }
      }

      searchOutput.addEventListener("click", (event) => {
        const button = event.target.closest('[data-act="photo-token"]');
        if (!button) return;
        const token = window.prompt("Kod akses foto (PHOTO_ACCESS_TOKEN):");
        if (!token || !token.trim()) return;
        try { sessionStorage.setItem(PHOTO_TOKEN_KEY, token.trim()); } catch (e) { return; }
        button.closest(".photo-hint").remove();
        loadPhotos();
      });

      async function loadStudentsFromSheet() {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_TAB)}&tqx=out:json`;
        searchOutput.innerHTML = "<p>Memuat data pelajar dari Google Sheet...</p>";

        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error("Gagal akses sheet");
          const text = await response.text();
          const jsonText = text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1);
          const parsed = JSON.parse(jsonText);
          const rows = parsed.table.rows || [];
          const headers = (parsed.table.cols || []).map((col) => col.label || col.id || "");

          const nameCol = findColumnIndex(headers, ["nama", "namamurid", "murid", "namapelajar"]);
          const noKpCol = findColumnIndex(headers, ["nokp", "nokadpengenalan", "ic", "nokad"]);
          const classCol = findColumnIndex(headers, ["kelas", "class", "tingkatan"]);

          students = rows
            .map((row) => (row.c || []).map((cell) => (cell && cell.v != null ? String(cell.v) : "")))
            .map((cells) => ({
              nama: nameCol >= 0 ? cells[nameCol] || "" : "",
              noKp: noKpCol >= 0 ? cells[noKpCol] || "" : "",
              kelas: classCol >= 0 ? cells[classCol] || "" : ""
            }))
            .filter((student) => student.nama || student.noKp || student.kelas);

          if (!students.length) {
            searchOutput.innerHTML = "<p>Data dijumpai tetapi tiada rekod pelajar yang sah.</p>";
            return;
          }

          searchOutput.innerHTML = "<p>Sila masukkan maklumat pelajar untuk membuat carian.</p>";
        } catch (error) {
          searchOutput.innerHTML =
            "<p>Gagal memuat data dari Google Sheet. Pastikan sheet boleh diakses (publish/share) dan cuba semula.</p>";
        }
      }

      async function loadCaseRecordsFromSheet() {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(CASES_TAB)}&tqx=out:json`;

        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error("Gagal akses tab rekod kes");
          const text = await response.text();
          const jsonText = text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1);
          const parsed = JSON.parse(jsonText);
          const rows = parsed.table.rows || [];
          const headers = (parsed.table.cols || []).map((col) => col.label || col.id || "");

          const namaCol = findColumnIndex(headers, ["nama", "namamurid", "murid", "namapelajar"]);
          const tarikhCol = findColumnIndex(headers, ["tarikh", "date"]);
          const kategoriCol = findColumnIndex(headers, ["kategori", "jeniskesalahan", "jenis"]);
          const statusCol = findColumnIndex(headers, ["status"]);
          const catatanCol = findColumnIndex(headers, ["catatan", "butiran", "keterangan"]);

          caseRecords = rows
            .map((row) => (row.c || []).map((cell) => (cell && cell.v != null ? String(cell.v) : "")))
            .map((cells) => ({
              nama: namaCol >= 0 ? cells[namaCol] || "" : "",
              tarikh: tarikhCol >= 0 ? cells[tarikhCol] || "" : "",
              kategori: kategoriCol >= 0 ? cells[kategoriCol] || "" : "",
              status: statusCol >= 0 ? cells[statusCol] || "" : "",
              catatan: catatanCol >= 0 ? cells[catatanCol] || "" : ""
            }))
            .filter((item) => item.nama);
        } catch {
          caseRecords = [];
        }
      }

      studentSearchForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const nameQuery = studentNameInput.value.trim().toLowerCase();
        const noKpQuery = studentNoKpInput.value.trim().toLowerCase();
        const classQuery = studentClassInput.value.trim().toLowerCase();

        if (!students.length) {
          searchOutput.innerHTML = "<p>Data pelajar belum dimuat. Sila tunggu sebentar dan cuba lagi.</p>";
          return;
        }

        const filtered = students.filter((student) => {
          const matchName = !nameQuery || student.nama.toLowerCase().includes(nameQuery);
          const matchNoKp = !noKpQuery || student.noKp.toLowerCase().includes(noKpQuery);
          const matchClass = !classQuery || student.kelas.toLowerCase().includes(classQuery);
          return matchName && matchNoKp && matchClass;
        });
        renderStudents(filtered);
      });

      Promise.all([loadStudentsFromSheet(), loadCaseRecordsFromSheet()]).catch(() => {});

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredPrompt = event;
        setInstallStatus("sedia dipasang");
      });

      installBtn.addEventListener("click", async () => {
        if (!deferredPrompt) {
          const ua = navigator.userAgent || "";
          const isIOS = /iPad|iPhone|iPod/i.test(ua);
          const isAndroid = /Android/i.test(ua);
          if (isIOS) {
            setInstallStatus("iPhone/iPad: guna Share > Add to Home Screen.");
          } else if (isAndroid) {
            setInstallStatus("Android: buka menu browser (⋮) > Install app / Add to Home screen.");
          } else {
            setInstallStatus("Jika tiada pop-up, buka menu browser dan pilih Install app.");
          }
          return;
        }
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        setInstallStatus("prompt sudah dipaparkan");
      });

      window.addEventListener("appinstalled", () => {
        installBtn.disabled = true;
        installBtn.textContent = "Aplikasi Dipasang";
        setInstallStatus("sudah dipasang");
      });

      if (!("serviceWorker" in navigator)) {
        setSwStatus("pelayar tidak menyokong");
        return;
      }

      navigator.serviceWorker.register("sw.js").then((registration) => {
        setSwStatus("aktif");

        if (registration.waiting) {
          refreshBtn.hidden = false;
          setSwStatus("kemas kini tersedia");
        }

        registration.addEventListener("updatefound", () => {
          const newWorker = registration.installing;
          if (!newWorker) return;

          newWorker.addEventListener("statechange", () => {
            if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
              refreshBtn.hidden = false;
              setSwStatus("kemas kini sedia");
            }
          });
        });

        setInterval(() => registration.update(), 60000);
      }).catch((error) => {
        setSwStatus(`gagal: ${error.message}`);
      });

      refreshBtn.addEventListener("click", () => {
        window.location.reload();
      });

      logoutBtn.addEventListener("click", () => {
        if (window.myDisiplinAuth) window.myDisiplinAuth.signOut();
      });
    })();
  </script>
