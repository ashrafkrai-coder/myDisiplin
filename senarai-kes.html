<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="myDisiplin" />
  <script src="assets/auth.js"></script>
  <script>
    if (window.myDisiplinAuth) window.myDisiplinAuth.requireAuth();
  </script>
  <title>myDisiplin - Senarai Kes</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/theme.css" />
  <style>
    /* ── iPhone-look Design System ── */
    :root {
      --ios-bg: #f2f2f7;
      --ios-surface: #ffffff;
      --ios-separator: rgba(60,60,67,0.12);
      --ios-label: #1c1c1e;
      --ios-label2: #3a3a3c;
      --ios-label3: #636366;
      --ios-label4: #8e8e93;
      --ios-accent: #007aff;
      --ios-teal: #30b0c7;
      --ios-green: #34c759;
      --ios-red: #ff3b30;
      --ios-orange: #ff9500;
      --ios-purple: #af52de;
      --ios-fill: rgba(120,120,128,0.12);
      --ios-fill2: rgba(120,120,128,0.08);
      --ios-radius: 16px;
      --ios-radius-sm: 10px;
      --ios-radius-xs: 8px;
      --ios-shadow: 0 2px 12px rgba(0,0,0,0.06), 0 0 1px rgba(0,0,0,0.08);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--ios-bg);
      color: var(--ios-label);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }

    body::before {
      content: '';
      display: block;
      height: env(safe-area-inset-top, 0px);
    }

    main {
      width: min(700px, 100%);
      margin: 0 auto;
      padding: 12px 16px 40px;
    }

    /* ── Hero ── */
    .hero {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px;
      border-radius: 24px;
      background: linear-gradient(145deg, #1c1c2e 0%, #0f2744 50%, #0a3d62 100%);
      box-shadow: 0 8px 32px rgba(0,0,0,0.28), 0 2px 8px rgba(0,0,0,0.20);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, transparent 60%);
      pointer-events: none;
      border-radius: inherit;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -30px;
      right: -20px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(0,122,255,0.35) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-text {
      flex: 1 1 auto;
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .hero-text h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      line-height: 1.1;
    }

    .hero-text p {
      margin: 5px 0 0;
      font-size: 12px;
      font-weight: 400;
      color: rgba(255,255,255,0.60);
      line-height: 1.4;
    }

    /* ── Quick Links ── */
    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .menu a {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 13px 10px;
      background: var(--ios-surface);
      border-radius: var(--ios-radius-sm);
      font-size: 13px;
      font-weight: 600;
      color: var(--ios-accent);
      text-decoration: none;
      box-shadow: var(--ios-shadow);
      transition: background 0.15s, transform 0.10s;
      line-height: 1.3;
      letter-spacing: -0.1px;
    }

    .menu a:active {
      background: rgba(0,122,255,0.08);
      transform: scale(0.97);
    }

    .menu a.active {
      background: var(--ios-accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(0,122,255,0.30);
    }

    /* ── Section Label ── */
    .section-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ios-label3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 4px;
      margin: 0 0 8px;
    }

    /* ── Toolbar / Filter Panel ── */
    .toolbar-panel {
      background: var(--ios-surface);
      border-radius: var(--ios-radius);
      box-shadow: var(--ios-shadow);
      padding: 0 0 4px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .toolbar-panel .panel-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--ios-label3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 14px 16px 0;
      margin-bottom: 4px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      padding: 0 16px;
    }

    .toolbar input[type="text"],
    .toolbar input[type="date"],
    .toolbar select {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--ios-separator);
      border-radius: 0;
      padding: 13px 0;
      font: 15px/1 var(--font);
      color: var(--ios-label);
      background: transparent;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .toolbar input[type="date"] {
      color: var(--ios-label3);
    }

    .toolbar input::placeholder,
    .toolbar select option[value=""] {
      color: var(--ios-label4);
    }

    .toolbar select {
      cursor: pointer;
    }

    .toolbar-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px 16px 12px;
    }

    .toolbar-actions button {
      padding: 12px;
      border: none;
      border-radius: var(--ios-radius-xs);
      font: 15px/1 var(--font);
      font-weight: 600;
      cursor: pointer;
      -webkit-appearance: none;
      transition: opacity 0.15s, transform 0.10s;
    }

    .toolbar-actions button:active {
      opacity: 0.70;
      transform: scale(0.97);
    }

    #btn-reset {
      background: var(--ios-fill);
      color: var(--ios-label2);
    }

    #btn-print {
      background: var(--ios-accent);
      color: #fff;
      box-shadow: 0 3px 10px rgba(0,122,255,0.25);
    }

    /* ── Case Cards (mobile list) ── */
    #list-container .empty {
      background: var(--ios-surface);
      border-radius: var(--ios-radius);
      box-shadow: var(--ios-shadow);
      padding: 20px 16px;
      text-align: center;
      color: var(--ios-label3);
      font-size: 15px;
      border: none;
      margin: 0;
    }

    /* Card list for mobile */
    .kes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .kes-card {
      background: var(--ios-surface);
      border-radius: var(--ios-radius);
      box-shadow: var(--ios-shadow);
      padding: 14px 16px;
      border-left: 4px solid var(--ios-orange);
      position: relative;
    }

    .kes-card.selesai {
      border-left-color: var(--ios-green);
      opacity: 0.85;
    }

    .kes-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .kes-nama {
      font-size: 16px;
      font-weight: 700;
      color: var(--ios-label);
      letter-spacing: -0.2px;
      margin: 0;
    }

    .kes-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .kes-badge.semakan {
      background: rgba(255,149,0,0.12);
      color: var(--ios-orange);
    }

    .kes-badge.selesai {
      background: rgba(52,199,89,0.12);
      color: var(--ios-green);
    }

    .kes-meta {
      font-size: 12px;
      color: var(--ios-label3);
      line-height: 1.7;
    }

    .kes-meta span {
      display: inline-block;
      margin-right: 10px;
    }

    .kes-catatan {
      font-size: 13px;
      color: var(--ios-label2);
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--ios-separator);
      line-height: 1.5;
    }

    /* Status Toggle Row */
    .kes-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--ios-separator);
    }

    .kes-status-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ios-label3);
    }

    /* iOS-style toggle switch */
    .ios-toggle {
      position: relative;
      display: inline-block;
      width: 51px;
      height: 31px;
      flex-shrink: 0;
    }

    .ios-toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .ios-toggle-track {
      position: absolute;
      inset: 0;
      background: rgba(120,120,128,0.20);
      border-radius: 31px;
      transition: background 0.25s;
      cursor: pointer;
    }

    .ios-toggle input:checked + .ios-toggle-track {
      background: var(--ios-green);
    }

    .ios-toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 27px;
      height: 27px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25), 0 0 1px rgba(0,0,0,0.08);
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
      pointer-events: none;
    }

    .ios-toggle input:checked ~ .ios-toggle-thumb {
      transform: translateX(20px);
    }

    /* ── Print ── */
    @media print {
      body { background: #fff; }
      .hero, .menu, .toolbar-panel, .no-print { display: none !important; }
      .kes-card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
    }

    /* ── Responsive ── */
    @media (min-width: 431px) {
      main { padding-top: 24px; padding-bottom: 60px; }
    }

    @media (max-width: 390px) {
      .hero-text h1 { font-size: 22px; }
      .menu a { font-size: 12px; padding: 11px 8px; }
    }
  </style>
</head>
<body>
  <main>
    <!-- Hero Header -->
    <div class="hero">
      <div class="hero-text">
        <h1>Senarai Kes</h1>
        <p>Rekod kesalahan murid SMK Taman Medan</p>
      </div>
    </div>

    <!-- Quick Nav -->
    <div class="menu">
      <a href="index.html#carian-murid">Carian Nama Murid</a>
      <a href="rekod-kes-baru.html">Rekod Kes Baru</a>
      <a href="senarai-kes.html" class="active">Senarai Kes</a>
      <a href="dashbord.html">Dashbord</a>
    </div>

    <!-- Filter Panel -->
    <p class="section-label">Tapis Rekod</p>
    <div class="toolbar-panel no-print">
      <div class="toolbar">
        <input id="filter-nama" type="text" placeholder="Tapis nama murid" />
        <select id="filter-kategori">
          <option value="">Semua kategori</option>
        </select>
        <select id="filter-status">
          <option value="">Semua status</option>
          <option value="Dalam Semakan">Dalam Semakan</option>
          <option value="Selesai">Selesai</option>
        </select>
        <input id="filter-tarikh-mula" type="date" title="Tarikh dari" />
        <input id="filter-tarikh-akhir" type="date" title="Tarikh hingga" />
      </div>
      <div class="toolbar-actions">
        <button id="btn-reset" type="button">Reset</button>
        <button id="btn-print" type="button">Cetak / PDF</button>
      </div>
    </div>

    <!-- Results -->
    <p class="section-label">Rekod Kes</p>
    <div id="list-container"></div>
  </main>

  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

    const SHEET_TAB = "Rekod kes baru";
    const container = document.getElementById("list-container");
    const filterNamaEl = document.getElementById("filter-nama");
    const filterKategoriEl = document.getElementById("filter-kategori");
    const filterStatusEl = document.getElementById("filter-status");
    const filterTarikhMulaEl = document.getElementById("filter-tarikh-mula");
    const filterTarikhAkhirEl = document.getElementById("filter-tarikh-akhir");
    const btnResetEl = document.getElementById("btn-reset");
    const btnPrintEl = document.getElementById("btn-print");
    let latestRows = [];

    function normalizeKey(value) {
      return String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function findColumnIndex(headers, aliases) {
      return headers.findIndex((header) => aliases.includes(normalizeKey(header)));
    }

    function formatTarikhDisplay(value) {
      const raw = String(value == null ? "" : value).trim();
      if (!raw) return "-";

      const gviz = raw.match(/^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/i);
      if (gviz) {
        const dd = String(Number(gviz[3])).padStart(2, "0");
        const mm = String(Number(gviz[2]) + 1).padStart(2, "0");
        return `${dd}/${mm}/${gviz[1]}`;
      }

      const iso = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (iso) {
        const dd = String(Number(iso[3])).padStart(2, "0");
        const mm = String(Number(iso[2])).padStart(2, "0");
        return `${dd}/${mm}/${iso[1]}`;
      }

      const malay = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (malay) {
        return `${String(Number(malay[1])).padStart(2,"0")}/${String(Number(malay[2])).padStart(2,"0")}/${malay[3]}`;
      }

      const native = new Date(raw);
      if (!Number.isNaN(native.getTime())) {
        const dd = String(native.getDate()).padStart(2, "0");
        const mm = String(native.getMonth() + 1).padStart(2, "0");
        return `${dd}/${mm}/${native.getFullYear()}`;
      }

      return raw.replace(/^Date/i, "").trim() || "-";
    }

    function parseTarikhToDate(value) {
      const raw = String(value == null ? "" : value).trim();
      if (!raw) return null;

      const gviz = raw.match(/^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/i);
      if (gviz) return new Date(Number(gviz[1]), Number(gviz[2]), Number(gviz[3]));

      const iso = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (iso) return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));

      const malay = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (malay) return new Date(Number(malay[3]), Number(malay[2]) - 1, Number(malay[1]));

      const native = new Date(raw);
      if (Number.isNaN(native.getTime())) return null;
      return new Date(native.getFullYear(), native.getMonth(), native.getDate());
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderCards(rows) {
      if (!rows.length) {
        container.innerHTML = "<div class='empty'>Tiada rekod kes dijumpai.</div>";
        return;
      }

      container.innerHTML = `<div class="kes-list">${rows.map((item) => {
        const isSelesai = String(item.status || "").trim().toLowerCase() === "selesai";
        const statusLabel = isSelesai ? "Selesai" : "Dalam Semakan";
        const badgeClass = isSelesai ? "selesai" : "semakan";

        return `
          <div class="kes-card ${isSelesai ? "selesai" : ""}">
            <div class="kes-card-header">
              <p class="kes-nama">${escapeHtml(item.nama || "-")}</p>
              <span class="kes-badge ${badgeClass}">${statusLabel}</span>
            </div>
            <div class="kes-meta">
              <span>📅 ${formatTarikhDisplay(item.tarikh)}${item.masa ? " · " + escapeHtml(item.masa) : ""}</span>
              <span>🏫 ${escapeHtml(item.kelas || "-")}</span>
              <span>🪪 ${escapeHtml(item.noKp || "-")}</span>
              <span>📂 ${escapeHtml(item.kategori || "-")}</span>
            </div>
            ${item.catatan ? `<div class="kes-catatan">💬 ${escapeHtml(item.catatan)}</div>` : ""}
            <div class="kes-status-row">
              <span class="kes-status-label">Tandakan Selesai</span>
              <label class="ios-toggle">
                <input
                  type="checkbox"
                  class="status-toggle"
                  data-row="${item.rowNumber}"
                  ${isSelesai ? "checked" : ""}
                />
                <div class="ios-toggle-track"></div>
                <div class="ios-toggle-thumb"></div>
              </label>
            </div>
          </div>
        `;
      }).join("")}</div>`;
    }

    function getFilteredRows() {
      const namaQuery = filterNamaEl.value.trim().toLowerCase();
      const kategoriQuery = filterKategoriEl.value.trim().toLowerCase();
      const statusQuery = filterStatusEl.value.trim().toLowerCase();
      const tarikhMulaRaw = filterTarikhMulaEl.value;
      const tarikhAkhirRaw = filterTarikhAkhirEl.value;
      const tarikhMula = tarikhMulaRaw ? new Date(`${tarikhMulaRaw}T00:00:00`) : null;
      const tarikhAkhir = tarikhAkhirRaw ? new Date(`${tarikhAkhirRaw}T23:59:59`) : null;

      return latestRows.filter((item) => {
        const matchNama = !namaQuery || String(item.nama || "").toLowerCase().includes(namaQuery);
        const matchKategori = !kategoriQuery || String(item.kategori || "").toLowerCase().includes(kategoriQuery);
        const matchStatus = !statusQuery || String(item.status || "").toLowerCase() === statusQuery;
        const tarikhRekod = parseTarikhToDate(item.tarikh);
        const matchTarikhMula = !tarikhMula || (tarikhRekod && tarikhRekod >= tarikhMula);
        const matchTarikhAkhir = !tarikhAkhir || (tarikhRekod && tarikhRekod <= tarikhAkhir);
        return matchNama && matchKategori && matchStatus && matchTarikhMula && matchTarikhAkhir;
      });
    }

    function populateKategoriOptions(rows) {
      const current = filterKategoriEl.value;
      const categories = Array.from(
        new Set(rows.map((item) => String(item.kategori || "").trim()).filter(Boolean))
      ).sort((a, b) => a.localeCompare(b, "ms"));

      filterKategoriEl.innerHTML =
        `<option value="">Semua kategori</option>` +
        categories.map((cat) => `<option value="${cat}">${cat}</option>`).join("");

      if (current && categories.includes(current)) filterKategoriEl.value = current;
    }

    function applyFilters() {
      renderCards(getFilteredRows());
    }

    async function updateStatusInSheet(rowNumber, status) {
      await window.myDisiplinAuth.call("update_status", { rowNumber, status });
      return true;
    }

    async function loadKesFromSheet() {
      container.innerHTML = "<div class='empty'>Memuat rekod kes...</div>";

      try {
        const table = await window.myDisiplinAuth.sheetTable(SHEET_TAB);
        const rows = table.rows;
        const headers = table.headers;

        const idCol = findColumnIndex(headers, ["id"]);
        const noKpCol = findColumnIndex(headers, ["nokp", "nokadpengenalan", "nokad", "no_kp"]);
        const tarikhCol = findColumnIndex(headers, ["tarikh", "date"]);
        const masaCol = findColumnIndex(headers, ["masa", "time"]);
        const namaCol = findColumnIndex(headers, ["nama", "namamurid", "murid", "namapelajar"]);
        const kelasCol = findColumnIndex(headers, ["kelas", "class", "tingkatan"]);
        const kategoriCol = findColumnIndex(headers, ["kategori", "jeniskesalahan", "jenis"]);
        const catatanCol = findColumnIndex(headers, ["catatan", "keterangan", "butiran"]);
        const statusCol = findColumnIndex(headers, ["status"]);

        latestRows = rows
          .map((row, index) => {
            const cells = (row.c || []).map((cell) => (cell && cell.v != null ? String(cell.v) : ""));
            return {
              rowNumber: index + 2,
              id: idCol >= 0 ? cells[idCol] || "" : "",
              noKp: noKpCol >= 0 ? cells[noKpCol] || "" : "",
              tarikh: tarikhCol >= 0 ? cells[tarikhCol] || "" : "",
              masa: masaCol >= 0 ? cells[masaCol] || "" : "",
              nama: namaCol >= 0 ? cells[namaCol] || "" : "",
              kelas: kelasCol >= 0 ? cells[kelasCol] || "" : "",
              kategori: kategoriCol >= 0 ? cells[kategoriCol] || "" : "",
              catatan: catatanCol >= 0 ? cells[catatanCol] || "" : "",
              status: statusCol >= 0 ? cells[statusCol] || "" : "Dalam Semakan"
            };
          })
          .filter((item) => item.nama || item.noKp || item.kategori || item.catatan);

        populateKategoriOptions(latestRows);
        applyFilters();
      } catch (error) {
        container.innerHTML = `<div class='empty'>Gagal memuat rekod kes: ${escapeHtml(error.message)}</div>`;
      }
    }

    container.addEventListener("change", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLInputElement) || !target.classList.contains("status-toggle")) return;

      const rowNumber = Number(target.dataset.row);
      if (!Number.isInteger(rowNumber) || rowNumber < 2) return;
      const newStatus = target.checked ? "Selesai" : "Dalam Semakan";
      target.disabled = true;

      updateStatusInSheet(rowNumber, newStatus)
        .then((ok) => {
          if (!ok) throw new Error("Gagal kemas kini status");
          latestRows = latestRows.map((item) =>
            item.rowNumber === rowNumber ? { ...item, status: newStatus } : item
          );
          applyFilters();
        })
        .catch(() => {
          target.checked = !target.checked;
          target.disabled = false;
          container.insertAdjacentHTML("afterbegin", "<div class='empty'>Status gagal dikemas kini.</div>");
        });
    });

    filterNamaEl.addEventListener("input", applyFilters);
    filterKategoriEl.addEventListener("input", applyFilters);
    filterStatusEl.addEventListener("change", applyFilters);
    filterTarikhMulaEl.addEventListener("change", applyFilters);
    filterTarikhAkhirEl.addEventListener("change", applyFilters);

    btnResetEl.addEventListener("click", () => {
      filterNamaEl.value = "";
      filterKategoriEl.value = "";
      filterStatusEl.selectedIndex = 0;
      filterTarikhMulaEl.value = "";
      filterTarikhAkhirEl.value = "";
      applyFilters();
    });

    btnPrintEl.addEventListener("click", () => window.print());

    loadKesFromSheet();
  </script>
</body>
