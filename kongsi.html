<!doctype html>
<html class="ios-ui" lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f2744" />
  <script src="assets/auth.js"></script>
  <script>
    if (window.myDisiplinAuth) window.myDisiplinAuth.requireAuth();
  </script>
  <title>myDisiplin - Terima Kongsi</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/theme.css" />
  <link rel="icon" href="icons/icon32.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon180.png" />
  <style>
    .panel p { margin: 0 0 12px; font-size: var(--fs-body); color: var(--ios-label3); }
    pre {
      margin: 0;
      background: var(--ios-fill2);
      border-radius: var(--ios-radius-sm);
      padding: 12px 14px;
      font-size: var(--fs-small);
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
  <link rel="stylesheet" href="assets/dark.css" /><script src="assets/theme-toggle.js"></script>
  <link rel="stylesheet" href="assets/app-header.css" /><script src="assets/app-header.js" defer></script>
  <link rel="stylesheet" href="assets/desktop.css" />
</head>
<body>
  <main>
    <div class="hero">
      <div class="hero-text">
        <h1>Data Perkongsian</h1>
        <p>Data yang dikongsi dari aplikasi lain</p>
      </div>
    </div>

    <div class="menu">
      <a href="rekod-kes-baru.html">Rekod Kes Baru</a>
      <a href="senarai-kes.html">Senarai Kes</a>
      <a href="dashbord.html">Dashbord</a>
      <a href="profil-murid.html">Profil &amp; Foto Murid</a>
    </div>

    <p class="section-label">Data Diterima</p>
    <div class="panel">
      <p>Halaman ini menerima data daripada fungsi kongsi pelayar (Web Share Target).</p>
      <pre id="result">Tiada data diterima.</pre>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const data = {
      tajuk: params.get("title") || "",
      teks: params.get("text") || "",
      url: params.get("url") || ""
    };
    const hasData = data.tajuk || data.teks || data.url;
    document.getElementById("result").textContent = hasData
      ? JSON.stringify(data, null, 2)
      : "Tiada data diterima.";
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
