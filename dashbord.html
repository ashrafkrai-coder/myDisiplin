<!doctype html>
<html class="ios-ui" lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="myDisiplin" />
  <script src="assets/auth.js"></script>
  <script>
    if (window.myDisiplinAuth) window.myDisiplinAuth.requireAuth();
  </script>
  <title>myDisiplin - Dashbord</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/theme.css" />
  <style>
    /* ── iPhone-look Design System ── */
    :root {
      --ios-bg: #f2f2f7;
      --ios-surface: #ffffff;
      --ios-separator: rgba(60,60,67,0.12);
      --ios-label: #1c1c1e;
      --ios-label2: #3a3a3c;
      --ios-label3: #636366;
      --ios-label4: #8e8e93;
      --ios-accent: #007aff;
      --ios-teal: #30b0c7;
      --ios-green: #34c759;
      --ios-red: #ff3b30;
      --ios-orange: #ff9500;
      --ios-purple: #af52de;
      --ios-fill: rgba(120,120,128,0.12);
      --ios-fill2: rgba(120,120,128,0.08);
      --ios-radius: 16px;
      --ios-radius-sm: 10px;
      --ios-radius-xs: 8px;
      --ios-shadow: 0 2px 12px rgba(0,0,0,0.06), 0 0 1px rgba(0,0,0,0.08);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--ios-bg);
      color: var(--ios-label);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }

    main {
      width: min(430px, 100%);
      margin: 0 auto;
      padding: 12px 16px 40px;
    }

    /* ── Status Bar Spacer ── */
    body::before {
      content: '';
      display: block;
      height: env(safe-area-inset-top, 0px);
    }

    /* ── Hero / App Header ── */
    .hero {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px;
      border-radius: 24px;
      background: linear-gradient(145deg, #1c1c2e 0%, #0f2744 50%, #0a3d62 100%);
      box-shadow: 0 8px 32px rgba(0,0,0,0.28), 0 2px 8px rgba(0,0,0,0.20);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, transparent 60%);
      pointer-events: none;
      border-radius: inherit;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -30px;
      right: -20px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(0,122,255,0.35) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-text {
      flex: 1 1 auto;
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .hero-text h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      line-height: 1.1;
    }

    .hero-text p {
      margin: 5px 0 0;
      font-size: 12px;
      font-weight: 400;
      color: rgba(255,255,255,0.60);
      line-height: 1.4;
    }

    /* ── Quick Links ── */
    .quick-links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .quick-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 13px 10px;
      background: var(--ios-surface);
      border-radius: var(--ios-radius-sm);
      font-size: 13px;
      font-weight: 600;
      color: var(--ios-accent);
      text-decoration: none;
      box-shadow: var(--ios-shadow);
      transition: background 0.15s, transform 0.10s, box-shadow 0.15s;
      line-height: 1.3;
      letter-spacing: -0.1px;
    }

    .quick-links a:active {
      background: rgba(0,122,255,0.08);
      transform: scale(0.97);
      box-shadow: none;
    }

    .quick-links a.active {
      background: var(--ios-accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(0,122,255,0.30);
    }

    /* ── Section Label ── */
    .section-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ios-label3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 4px;
      margin: 0 0 8px;
    }

    /* ── Stats Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--ios-surface);
      border-radius: var(--ios-radius);
      box-shadow: var(--ios-shadow);
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: 16px 16px 0 0;
    }

    .card:nth-child(1)::before { background: var(--ios-accent); }
    .card:nth-child(2)::before { background: var(--ios-orange); }
    .card:nth-child(3)::before { background: var(--ios-green); }
    .card:nth-child(4)::before { background: var(--ios-purple); }

    .card-icon {
      font-size: 22px;
      margin-bottom: 8px;
      display: block;
    }

    .card-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ios-label3);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      line-height: 1.3;
    }

    .value {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
      margin: 6px 0 0;
      color: var(--ios-label);
    }

    .card:nth-child(1) .value { color: var(--ios-accent); }
    .card:nth-child(2) .value { color: var(--ios-orange); }
    .card:nth-child(3) .value { color: var(--ios-green); }
    .card:nth-child(4) .value { color: var(--ios-purple); }

    /* ── Info / Status Panel ── */
    .hint-panel {
      background: var(--ios-surface);
      border-radius: var(--ios-radius);
      box-shadow: var(--ios-shadow);
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    #kemaskini {
      font-size: 13px;
      color: var(--ios-label3);
      margin: 0;
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #kemaskini::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ios-green);
      flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Responsive ── */
    @media (min-width: 431px) {
      main {
        padding-top: 24px;
        padding-bottom: 60px;
      }
    }

    @media (max-width: 390px) {
      .hero-text h1 { font-size: 22px; }
      .quick-links a { font-size: 12px; padding: 11px 8px; }
      .value { font-size: 30px; }
    }
  </style>
<link rel="stylesheet" href="assets/dark.css" /><script src="assets/theme-toggle.js"></script>
<link rel="stylesheet" href="assets/app-header.css" /><script src="assets/app-header.js" defer></script>
<link rel="stylesheet" href="assets/desktop.css" />
</head>
<body>
  <main>
    <!-- Hero Header -->
    <div class="hero">
      <div class="hero-text">
        <h1>Dashbord</h1>
        <p>Ringkasan statistik kes dan murid SMK Taman Medan</p>
      </div>
    </div>

    <!-- Quick Nav -->
    <div class="quick-links">
      <a href="rekod-kes-baru.html">Rekod Kes Baru</a>
      <a href="senarai-kes.html">Senarai Kes</a>
      <a href="dashbord.html" class="active">Dashbord</a>
      <a href="profil-murid.html">Profil &amp; Foto Murid</a>
    </div>

    <!-- Stats Cards -->
    <p class="section-label">Statistik</p>
    <div class="grid">
      <div class="card">
        <span class="card-icon">👥</span>
        <div class="card-label">Jumlah Murid</div>
        <div id="jumlah-murid" class="value">—</div>
      </div>
      <div class="card">
        <span class="card-icon">📋</span>
        <div class="card-label">Kes Bulan Ini</div>
        <div id="kes-bulan-ini" class="value">—</div>
      </div>
      <div class="card">
        <span class="card-icon">✅</span>
        <div class="card-label">Kes Selesai</div>
        <div id="kes-selesai" class="value">—</div>
      </div>
      <div class="card">
        <span class="card-icon">🔍</span>
        <div class="card-label">Dalam Semakan</div>
        <div id="kes-semakan" class="value">—</div>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="hint-panel">
      <p id="kemaskini">Memuat data...</p>
    </div>
  </main>

  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

    const STUDENT_TAB = "data";
    const CASE_TAB = "Rekod kes baru";
    const jumlahMuridEl = document.getElementById("jumlah-murid");
    const kesBulanIniEl = document.getElementById("kes-bulan-ini");
    const kesSelesaiEl = document.getElementById("kes-selesai");
    const kesSemakanEl = document.getElementById("kes-semakan");
    const kemaskiniEl = document.getElementById("kemaskini");

    function normalizeKey(value) {
      return String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function findColumnIndex(headers, aliases) {
      return headers.findIndex((header) => aliases.includes(normalizeKey(header)));
    }

    async function fetchSheetRows(tabName) {
      return window.myDisiplinAuth.sheetTable(tabName);
    }

    function parseDateValue(value) {
      if (value == null) return null;
      const raw = String(value).trim();
      if (!raw) return null;

      const gvizMatch = raw.match(/^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/i);
      if (gvizMatch) {
        return new Date(Number(gvizMatch[1]), Number(gvizMatch[2]), Number(gvizMatch[3]));
      }

      const malay = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (malay) {
        return new Date(Number(malay[3]), Number(malay[2]) - 1, Number(malay[1]));
      }

      const iso = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (iso) {
        return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
      }

      const native = new Date(raw);
      return Number.isNaN(native.getTime()) ? null : native;
    }

    function animateValue(el, target) {
      const duration = 600;
      const start = performance.now();
      const from = 0;
      function step(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = String(Math.round(from + (target - from) * eased));
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function updateDashboard(totalMurid, rows) {
      const now = new Date();
      const bulan = now.getMonth();
      const tahun = now.getFullYear();

      const kesBulanIni = rows.filter((item) => {
        const tarikh = parseDateValue(item.tarikh);
        if (!tarikh) return false;
        return tarikh.getMonth() === bulan && tarikh.getFullYear() === tahun;
      }).length;

      const kesSelesai = rows.filter((item) =>
        String(item.status || "").trim().toLowerCase() === "selesai"
      ).length;

      const kesSemakan = rows.filter((item) =>
        String(item.status || "").trim().toLowerCase() === "dalam semakan"
      ).length;

      animateValue(jumlahMuridEl, totalMurid);
      animateValue(kesBulanIniEl, kesBulanIni);
      animateValue(kesSelesaiEl, kesSelesai);
      animateValue(kesSemakanEl, kesSemakan);

      kemaskiniEl.textContent = `Dikemas kini: ${now.toLocaleString("ms-MY")}`;
    }

    async function loadDashboardFromSheet() {
      kemaskiniEl.textContent = "Memuat data...";

      try {
        const [studentData, caseData] = await Promise.all([
          fetchSheetRows(STUDENT_TAB),
          fetchSheetRows(CASE_TAB)
        ]);

        const totalMurid = studentData.rows
          .map((row) => {
            const firstCell = row && row.c && row.c[0] ? row.c[0].v : "";
            return String(firstCell == null ? "" : firstCell).trim();
          })
          .filter(Boolean).length;

        const tarikhCol = findColumnIndex(caseData.headers, ["tarikh", "date"]);
        const namaCol = findColumnIndex(caseData.headers, ["nama", "namamurid", "murid"]);
        const statusCol = findColumnIndex(caseData.headers, ["status"]);

        const records = caseData.rows
          .map((row) => (row.c || []).map((cell) => (cell && cell.v != null ? String(cell.v) : "")))
          .map((cells) => ({
            tarikh: tarikhCol >= 0 ? cells[tarikhCol] || "" : "",
            nama: namaCol >= 0 ? cells[namaCol] || "" : "",
            status: statusCol >= 0 ? cells[statusCol] || "" : ""
          }))
          .filter((item) => item.tarikh || item.nama || item.status);

        updateDashboard(totalMurid, records);
      } catch (error) {
        jumlahMuridEl.textContent = "0";
        kesBulanIniEl.textContent = "0";
        kesSelesaiEl.textContent = "0";
        kesSemakanEl.textContent = "0";
        kemaskiniEl.textContent = "Gagal memuat data: " + (error && error.message ? error.message : "ralat tidak diketahui");
      }
    }

    loadDashboardFromSheet();
    window.addEventListener("focus", loadDashboardFromSheet);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) loadDashboardFromSheet();
    });
  </script>
</body>
</html>
