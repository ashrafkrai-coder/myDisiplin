  <style>

    /* ── Form Card ── */
    .form-card {
      background: var(--ios-surface);
      border-radius: var(--ios-radius);
      box-shadow: var(--ios-shadow);
      overflow: hidden;
      margin-bottom: 16px;
    }

    /* Field rows */
    .field-row {
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
      border-bottom: 1px solid var(--ios-separator);
    }

    .field-row:last-child {
      border-bottom: none;
    }

    /* Tingkatan and Kelas side by side */
    .field-pair {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
      border-bottom: 1px solid var(--ios-separator);
    }
    .field-pair:last-child { border-bottom: none; }
    .field-pair .field-row { border-bottom: none; min-width: 0; }
    .field-pair .field-row + .field-row { border-left: 1px solid var(--ios-separator); }

    .field-row label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ios-label3);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin: 0 0 5px;
      display: block;
    }

    .field-row input[type="text"],
    .field-row input[type="date"],
    .field-row select,
    .field-row textarea {
      width: 100%;
      border: none;
      border-radius: 0;
      padding: 0;
      font: var(--fs-input)/1.4 var(--font);
      color: var(--ios-label);
      background: transparent;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .field-row input::placeholder,
    .field-row textarea::placeholder {
      color: var(--ios-label4);
    }

    .field-row input[type="date"] {
      color: var(--ios-label);
    }

    .field-row select {
      cursor: pointer;
      color: var(--ios-label);
    }

    .field-row select option[value=""] {
      color: var(--ios-label4);
    }

    .field-row textarea {
      resize: none;
      min-height: 80px;
      line-height: 1.5;
    }

    /* ── Progress Bar ── */
    .progress-wrap {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--ios-surface);
      border-radius: var(--ios-radius);
      box-shadow: var(--ios-shadow);
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .progress-wrap.visible {
      display: flex;
    }

    .progress-track {
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: var(--ios-fill);
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--ios-accent);
      border-radius: 999px;
      transition: width 180ms ease;
    }

    .progress-text {
      min-width: 36px;
      text-align: right;
      font-size: 13px;
      font-weight: 700;
      color: var(--ios-accent);
    }

    /* ── Status Message ── */
    .status-panel {
      background: var(--ios-surface);
      border-radius: var(--ios-radius);
      box-shadow: var(--ios-shadow);
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    #status {
      font-size: 14px;
      color: var(--ios-label3);
      margin: 0;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    #status::before {
      content: 'ℹ️';
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    #status.success::before { content: '✅'; }
    #status.error::before   { content: '⚠️'; }
    #status.loading::before { content: '⏳'; }

    /* ── Save Button ── */
    #simpan-btn {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: var(--ios-radius-sm);
      background: var(--ios-accent);
      color: #fff;
      font: var(--fs-btn)/1 var(--font);
      font-weight: 600;
      letter-spacing: -0.2px;
      cursor: pointer;
      box-shadow: var(--shadow-accent);
      transition: opacity 0.15s, transform 0.10s;
      -webkit-appearance: none;
      margin-bottom: 16px;
    }

    #simpan-btn:active {
      opacity: 0.75;
      transform: scale(0.98);
    }

    #simpan-btn:disabled {
      opacity: 0.50;
      cursor: not-allowed;
      transform: none;
    }
  </style>

  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

    // Records that could not be sent yet. Only unsent records are kept on the device; each is
    // removed as soon as the server accepts it.
    const PENDING_KEY = "mydisiplin_kes_pending";

    const namaEl = document.getElementById("nama");
    const noKpEl = document.getElementById("nokp");
    const kelasEl = document.getElementById("kelas");
    const tarikhEl = document.getElementById("tarikh");
    const jenisKesalahanEl = document.getElementById("jenis-kesalahan");
    const kategoriEl = document.getElementById("kategori");
    const catatanEl = document.getElementById("catatan");
    const buktiGridEl = document.getElementById("bukti-grid");
    const buktiHintEl = document.getElementById("bukti-hint");
    const buktiCameraEl = document.getElementById("bukti-camera");
    const buktiFileEl = document.getElementById("bukti-file");
    const buktiCameraBtn = document.getElementById("bukti-camera-btn");
    const buktiFileBtn = document.getElementById("bukti-file-btn");
    const simpanBtn = document.getElementById("simpan-btn");
    const progressWrapEl = document.getElementById("progress-wrap");
    const progressBarEl = document.getElementById("progress-bar");
    const progressTextEl = document.getElementById("progress-text");
    const statusEl = document.getElementById("status");

    // Today's date in the device's local time zone (toISOString() is UTC, which gives
    // yesterday's date before 8:00 am in Malaysia).
    function todayLocal() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    tarikhEl.value = todayLocal();

    function normalizeKelas(value) {
      return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    }

    function applyPrefillFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const nama = (params.get("nama") || "").trim();
      const noKp = (params.get("nokp") || "").trim();
      const kelas = (params.get("kelas") || "").trim();

      if (nama) namaEl.value = nama;
      if (noKp) noKpEl.value = noKp;
      if (kelas) setKelas(kelas);
    }

    // ── Separate Tingkatan and Kelas dropdowns ──
    // The class list comes from the optgroups in the HTML; the Kelas dropdown shows only the chosen
    // Tingkatan's classes (by name), while each option's value stays the full name such as "1 AMANAH".
    const tingkatanEl = document.getElementById("tingkatan");
    const ALL_KELAS = Array.from(kelasEl.querySelectorAll("option")).map((o) => o.value).filter(Boolean);
    const tingkatanOf = (value) => (String(value).trim().match(/^\d+/) || [""])[0];

    function showKelasFor(tingkatan, selected) {
      kelasEl.replaceChildren(new Option(tingkatan ? "Sila pilih kelas" : "Pilih tingkatan dahulu", ""));
      ALL_KELAS.filter((k) => tingkatanOf(k) === tingkatan)
        .forEach((k) => kelasEl.add(new Option(k.replace(/^\d+\s*/, ""), k)));
      kelasEl.disabled = !tingkatan;
      kelasEl.value = selected || "";
    }

    // Sets both dropdowns from a full class name; accepts "1 al farabi" for "1 AL-FARABI".
    function setKelas(value) {
      let match = ALL_KELAS.find((k) => normalizeKelas(k) === normalizeKelas(value)) || "";
      // A class from the student list that is not in the built-in list (e.g. a new class) is added.
      if (!match && tingkatanOf(value)) {
        match = String(value).trim().toUpperCase();
        ALL_KELAS.push(match);
        const t = tingkatanOf(match);
        if (!Array.from(tingkatanEl.options).some((o) => o.value === t)) tingkatanEl.add(new Option(t, t));
      }
      tingkatanEl.value = tingkatanOf(match);
      showKelasFor(tingkatanEl.value, match);
    }
    window.myDisiplinSetKelas = setKelas;

    tingkatanEl.addEventListener("change", () => showKelasFor(tingkatanEl.value, ""));
    showKelasFor("", "");

    applyPrefillFromQuery();

    if (new URLSearchParams(window.location.search).get("akses") === "terhad") {
      statusEl.textContent = "Akaun Guru hanya boleh merekod kes disiplin. Menu lain untuk Guru Disiplin, PK HEM dan Pengetua.";
      statusEl.className = "error";
    }

    // ── Evidence photos (gambar bukti) ──
    // Each photo is shrunk to at most 1280px and re-encoded as JPEG before upload.
    const MAX_BUKTI = 3;
    const BUKTI_HINT = buktiHintEl.textContent;
    let bukti = [];

    async function compressBukti(file) {
      if (!/^image\//.test(file.type)) throw new Error("Fail bukan gambar.");
      if (file.size > 20 * 1024 * 1024) throw new Error("Gambar terlalu besar (had 20 MB).");
      const url = URL.createObjectURL(file);
      try {
        const image = new Image();
        image.src = url;
        try { await image.decode(); } catch { throw new Error("Gambar rosak atau format tidak disokong. Cuba gambar lain."); }
        let quality = 0.72;
        let size = 1280;
        for (let attempt = 0; attempt < 4; attempt++) {
          const scale = Math.min(1, size / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
          const data = canvas.toDataURL("image/jpeg", quality);
          if (data.length <= 380000) return data;
          size = Math.round(size * 0.8);
          quality -= 0.08;
        }
        throw new Error("Gambar masih terlalu besar selepas dimampatkan.");
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function renderBukti() {
      buktiGridEl.replaceChildren();
      bukti.forEach((data, index) => {
        const box = document.createElement("div");
        box.className = "bukti-thumb";
        const img = document.createElement("img");
        img.src = data;
        img.alt = "Gambar bukti " + (index + 1);
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "Buang gambar bukti " + (index + 1));
        remove.addEventListener("click", () => { bukti.splice(index, 1); renderBukti(); });
        box.append(img, remove);
        buktiGridEl.append(box);
      });
      const full = bukti.length >= MAX_BUKTI;
      buktiCameraBtn.disabled = full;
      buktiFileBtn.disabled = full;
      buktiHintEl.textContent = bukti.length ? bukti.length + "/" + MAX_BUKTI + " gambar dilampirkan. " + BUKTI_HINT : BUKTI_HINT;
    }

    async function addBukti(input) {
      const files = Array.from(input.files || []);
      input.value = "";
      for (const file of files) {
        if (bukti.length >= MAX_BUKTI) {
          buktiHintEl.textContent = "Maksimum " + MAX_BUKTI + " gambar bukti bagi setiap kes.";
          break;
        }
        try {
          buktiHintEl.textContent = "Memproses gambar...";
          bukti.push(await compressBukti(file));
          renderBukti();
        } catch (error) {
          renderBukti();
          buktiHintEl.textContent = error.message;
        }
      }
    }

    buktiCameraBtn.addEventListener("click", () => buktiCameraEl.click());
    buktiFileBtn.addEventListener("click", () => buktiFileEl.click());
    buktiCameraEl.addEventListener("change", () => addBukti(buktiCameraEl));
    buktiFileEl.addEventListener("change", () => addBukti(buktiFileEl));

    function formatTarikhMalay(yyyyMmDd) {
      const parts = yyyyMmDd.split("-");
      if (parts.length !== 3) return new Date().toLocaleDateString("ms-MY");
      const [year, month, day] = parts.map(Number);
      if (!year || !month || !day) return new Date().toLocaleDateString("ms-MY");
      return new Date(year, month - 1, day).toLocaleDateString("ms-MY");
    }

    function getPending() {
      try {
        const list = JSON.parse(localStorage.getItem(PENDING_KEY) || "[]");
        return Array.isArray(list) ? list : [];
      } catch { return []; }
    }

    // Returns false when the device storage is full (evidence photos are large).
    function savePending(list) {
      try {
        if (list.length) localStorage.setItem(PENDING_KEY, JSON.stringify(list));
        else localStorage.removeItem(PENDING_KEY);
        return true;
      } catch {
        return false;
      }
    }

    // Sends queued records oldest first; stops at the first failure and tries again later.
    let flushing = false;
    async function flushPending() {
      if (flushing || !getPending().length) return;
      flushing = true;
      let sentCount = 0;
      try {
        while (getPending().length) {
          const [next] = getPending();
          const result = await sendToGoogleSheet(next);
          if (!result.ok) break;
          savePending(getPending().slice(1));
          sentCount++;
        }
      } finally {
        flushing = false;
      }
      const left = getPending().length;
      if (sentCount && !simpanBtn.disabled) {
        statusEl.className = left ? "error" : "success";
        statusEl.textContent = sentCount + " rekod tertangguh berjaya dihantar ke Google Sheet." +
          (left ? " " + left + " rekod lagi menunggu talian." : "");
      }
    }

    function setProgress(percent, message, type = "") {
      const safePercent = Math.max(0, Math.min(100, Number(percent) || 0));
      progressWrapEl.classList.add("visible");
      progressBarEl.style.width = `${safePercent}%`;
      progressTextEl.textContent = `${safePercent}%`;
      if (message) {
        statusEl.textContent = message;
        statusEl.className = type;
      }
    }

    function resetProgress() {
      progressWrapEl.classList.remove("visible");
      progressBarEl.style.width = "0%";
      progressTextEl.textContent = "0%";
    }

    async function sendToGoogleSheet(record) {
      try {
        await window.myDisiplinAuth.call("append", record);
        return { ok: true, error: "" };
      } catch (error) {
        return { ok: false, error: error?.message || "Ralat rangkaian." };
      }
    }

    // Lateness is graded by how many times the same student has been recorded for it:
    // 1-3 Ringan, 4-15 Sederhana, 16+ Berat (the new record counts as the next occurrence).
    const LATE_TYPE = "TINGKAH LAKU TIDAK PENTINGKAN MASA";
    const digitsOnly = (value) => Array.from(String(value || "")).filter((c) => c >= "0" && c <= "9").join("");
    const lateLevel = (count) => (count <= 3 ? "Ringan" : count <= 15 ? "Sederhana" : "Berat");
    let autoSeq = 0;

    // Counted on the server, so a Guru can grade lateness without reading the case list.
    async function countPriorLate(noKp) {
      const result = await window.myDisiplinAuth.call("late_count", { noKp: digitsOnly(noKp) });
      return Number(result.count) || 0;
    }

    // Returns the category for a lateness record, or null when it does not apply.
    async function autoKategori() {
      const seq = ++autoSeq;
      const isLate = jenisKesalahanEl.value === LATE_TYPE;
      kategoriEl.disabled = isLate;
      if (!isLate) return null;
      if (!digitsOnly(noKpEl.value)) {
        kategoriEl.value = "Ringan";
        return "Ringan";
      }
      const prior = await countPriorLate(noKpEl.value);
      const level = lateLevel(prior + 1);
      if (seq === autoSeq) {
        kategoriEl.value = level;
        statusEl.className = "";
        statusEl.textContent = "Kali ke-" + (prior + 1) + " lewat/tidak pentingkan masa: kategori " + level + ".";
      }
      return level;
    }

    function refreshAutoKategori() {
      autoKategori().catch(() => {
        if (jenisKesalahanEl.value === LATE_TYPE) kategoriEl.value = "Ringan";
      });
    }
    jenisKesalahanEl.addEventListener("change", refreshAutoKategori);
    noKpEl.addEventListener("change", () => { if (jenisKesalahanEl.value === LATE_TYPE) refreshAutoKategori(); });

    simpanBtn.addEventListener("click", async () => {
      if (simpanBtn.disabled) return;
      simpanBtn.disabled = true;
      setProgress(5, "Memproses rekod...", "loading");

      if (jenisKesalahanEl.value === LATE_TYPE && digitsOnly(noKpEl.value)) {
        try {
          await autoKategori();
        } catch (error) {
          statusEl.textContent = "Tidak dapat mengira bilangan kes lewat: " + (error?.message || "ralat rangkaian") + ". Cuba lagi.";
          statusEl.className = "error";
          simpanBtn.disabled = false;
          resetProgress();
          return;
        }
      }

      const nama = namaEl.value.trim();
      const noKp = noKpEl.value.trim();
      const kelas = kelasEl.value.trim();
      const tarikh = tarikhEl.value;
      const jenisKesalahan = jenisKesalahanEl.value.trim();
      const kategori = kategoriEl.value.trim();
      const catatan = catatanEl.value.trim();

      if (!nama || !noKp || !kelas || !tarikh || !jenisKesalahan || !kategori || !catatan) {
        statusEl.textContent = "Sila lengkapkan semua maklumat sebelum menyimpan.";
        statusEl.className = "error";
        simpanBtn.disabled = false;
        resetProgress();
        return;
      }

      setProgress(25, "Menyediakan rekod...", "loading");
      const now = new Date();
      const record = {
        id: noKp,
        tarikh: formatTarikhMalay(tarikh),
        masa: now.toLocaleTimeString("ms-MY"),
        nama, noKp, kelas, jenisKesalahan, kategori, catatan,
        status: "Dalam Semakan",
        bukti: bukti.slice()
      };

      setProgress(60, "Menghantar ke Google Sheet...", "loading");
      const syncResult = await sendToGoogleSheet(record);
      const sent = syncResult.ok;
      let storedWithoutBukti = false;
      if (!sent && !savePending(getPending().concat([record]))) {
        // Device storage is full: keep the case itself, without its photos.
        savePending(getPending().concat([{ ...record, bukti: [] }]));
        storedWithoutBukti = record.bukti.length > 0;
      }

      setProgress(90, "Memuktamadkan...", "loading");

      namaEl.value = "";
      noKpEl.value = "";
      window.myDisiplinStudentPicker?.resetAfterSave();
      bukti = [];
      renderBukti();
      tarikhEl.value = todayLocal();
      jenisKesalahanEl.selectedIndex = 0;
      catatanEl.value = "";
      kategoriEl.selectedIndex = 0;
      kategoriEl.disabled = false;

      setProgress(100,
        sent
          ? "Rekod berjaya disimpan dan dihantar ke Google Sheet."
          : `Rekod belum dihantar (${syncResult.error || "ralat tidak diketahui"}). Rekod disimpan dalam peranti ini dan akan dihantar semula secara automatik apabila talian pulih.` +
            (storedWithoutBukti ? " Storan peranti penuh: gambar bukti TIDAK disimpan." : ""),
        sent ? "success" : "error"
      );

      setTimeout(resetProgress, 1200);
      simpanBtn.disabled = false;
      if (sent) flushPending();
    });

    // Retry unsent records: when the browser reports it is online, when the app comes back to the
    // screen, and every 20 seconds while any are waiting (the "online" event can fire before the
    // connection actually works, and then nothing would retry until the page is reopened).
    window.addEventListener("online", flushPending);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") flushPending();
    });
    setInterval(() => {
      if (navigator.onLine !== false && getPending().length) flushPending();
    }, 20000);
    flushPending();
  </script>
  <script src="assets/student-picker.js"></script>
</body>
</html>
