<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="myDisiplin" />
  <script src="assets/auth.js"></script>
  <script>
    if (window.myDisiplinAuth) window.myDisiplinAuth.requireAuth();
  </script>
  <title>myDisiplin - Rekod Kes Baru</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/theme.css" />
  <style>
    /* ── iPhone-look Design System ── */
    :root {
      --ios-bg: #f2f2f7;
      --ios-surface: #ffffff;
      --ios-separator: rgba(60,60,67,0.12);
      --ios-label: #1c1c1e;
      --ios-label2: #3a3a3c;
      --ios-label3: #636366;
      --ios-label4: #8e8e93;
      --ios-accent: #007aff;
      --ios-teal: #30b0c7;
      --ios-green: #34c759;
      --ios-red: #ff3b30;
      --ios-orange: #ff9500;
      --ios-fill: rgba(120,120,128,0.12);
      --ios-fill2: rgba(120,120,128,0.08);
      --ios-radius: 16px;
      --ios-radius-sm: 10px;
      --ios-radius-xs: 8px;
      --ios-shadow: 0 2px 12px rgba(0,0,0,0.06), 0 0 1px rgba(0,0,0,0.08);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--ios-bg);
      color: var(--ios-label);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }

    body::before {
      content: '';
      display: block;
      height: env(safe-area-inset-top, 0px);
    }

    main {
      width: min(430px, 100%);
      margin: 0 auto;
      padding: 12px 16px 40px;
    }

    /* ── Hero ── */
    .hero {
      display: flex;
      align-items: center;
      padding: 18px;
      border-radius: 24px;
      background: linear-gradient(145deg, #1c1c2e 0%, #0f2744 50%, #0a3d62 100%);
      box-shadow: 0 8px 32px rgba(0,0,0,0.28), 0 2px 8px rgba(0,0,0,0.20);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, transparent 60%);
      pointer-events: none;
      border-radius: inherit;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -30px;
      right: -20px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(0,122,255,0.35) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-text {
      flex: 1 1 auto;
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .hero-text h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      line-height: 1.1;
    }

    .hero-text p {
      margin: 5px 0 0;
      font-size: 12px;
      font-weight: 400;
      color: rgba(255,255,255,0.60);
      line-height: 1.4;
    }

    /* ── Quick Links ── */
    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .menu a {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 13px 10px;
      background: var(--ios-surface);
      border-radius: var(--ios-radius-sm);
      font-size: 13px;
      font-weight: 600;
      color: var(--ios-accent);
      text-decoration: none;
      box-shadow: var(--ios-shadow);
      transition: background 0.15s, transform 0.10s;
      line-height: 1.3;
      letter-spacing: -0.1px;
    }

    .menu a:active {
      background: rgba(0,122,255,0.08);
      transform: scale(0.97);
    }

    .menu a.active {
      background: var(--ios-accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(0,122,255,0.30);
    }

    /* ── Section Label ── */
    .section-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ios-label3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 4px;
      margin: 0 0 8px;
    }

    /* ── Form Card ── */
    .form-card {
      background: var(--ios-surface);
      border-radius: var(--ios-radius);
      box-shadow: var(--ios-shadow);
      overflow: hidden;
      margin-bottom: 16px;
    }

    /* Field rows */
    .field-row {
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
      border-bottom: 1px solid var(--ios-separator);
    }

    .field-row:last-child {
      border-bottom: none;
    }

    .field-row label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ios-label3);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin: 0 0 5px;
      display: block;
    }

    .field-row input[type="text"],
    .field-row input[type="date"],
    .field-row select,
    .field-row textarea {
      width: 100%;
      border: none;
      border-radius: 0;
      padding: 0;
      font: 16px/1.4 var(--font);
      color: var(--ios-label);
      background: transparent;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .field-row input::placeholder,
    .field-row textarea::placeholder {
      color: var(--ios-label4);
    }

    .field-row input[type="date"] {
      color: var(--ios-label);
    }

    .field-row select {
      cursor: pointer;
      color: var(--ios-label);
    }

    .field-row select option[value=""] {
      color: var(--ios-label4);
    }

    .field-row textarea {
      resize: none;
      min-height: 80px;
      line-height: 1.5;
    }

    /* ── Progress Bar ── */
    .progress-wrap {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--ios-surface);
      border-radius: var(--ios-radius);
      box-shadow: var(--ios-shadow);
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .progress-wrap.visible {
      display: flex;
    }

    .progress-track {
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: var(--ios-fill);
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--ios-accent);
      border-radius: 999px;
      transition: width 180ms ease;
    }

    .progress-text {
      min-width: 36px;
      text-align: right;
      font-size: 13px;
      font-weight: 700;
      color: var(--ios-accent);
    }

    /* ── Status Message ── */
    .status-panel {
      background: var(--ios-surface);
      border-radius: var(--ios-radius);
      box-shadow: var(--ios-shadow);
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    #status {
      font-size: 14px;
      color: var(--ios-label3);
      margin: 0;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    #status::before {
      content: 'ℹ️';
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    #status.success::before { content: '✅'; }
    #status.error::before   { content: '⚠️'; }
    #status.loading::before { content: '⏳'; }

    /* ── Save Button ── */
    #simpan-btn {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: var(--ios-radius-sm);
      background: var(--ios-accent);
      color: #fff;
      font: 17px/1 var(--font);
      font-weight: 600;
      letter-spacing: -0.2px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,122,255,0.30);
      transition: opacity 0.15s, transform 0.10s;
      -webkit-appearance: none;
      margin-bottom: 16px;
    }

    #simpan-btn:active {
      opacity: 0.75;
      transform: scale(0.98);
    }

    #simpan-btn:disabled {
      opacity: 0.50;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Responsive ── */
    @media (min-width: 431px) {
      main { padding-top: 24px; padding-bottom: 60px; }
    }

    @media (max-width: 390px) {
      .hero-text h1 { font-size: 22px; }
      .menu a { font-size: 12px; padding: 11px 8px; }
    }
  </style>
  <link rel="stylesheet" href="assets/student-photos.css" />
</head>
<body>
  <main>
    <!-- Hero Header -->
    <div class="hero">
      <div class="hero-text">
        <h1>Rekod Kes Baru</h1>
        <p>Tambah rekod kesalahan murid SMK Taman Medan</p>
      </div>
    </div>

    <!-- Quick Nav -->
    <div class="menu">
      <a href="index.html#carian-murid">Carian Nama Murid</a>
      <a href="rekod-kes-baru.html" class="active">Rekod Kes Baru</a>
      <a href="senarai-kes.html">Senarai Kes</a>
      <a href="dashbord.html">Dashbord</a>
    </div>

    <div id="student-photo-picker"></div>
    <!-- Form -->
    <p class="section-label">Maklumat Murid</p>
    <div class="form-card">
      <div class="field-row">
        <label for="nama">Nama Murid</label>
        <input id="nama" type="text" placeholder="Contoh: Ali Bin Abu" />
      </div>
      <div class="field-row">
        <label for="nokp">No Kad Pengenalan</label>
        <input id="nokp" type="text" placeholder="Contoh: 090101011234" />
      </div>
      <div class="field-row">
        <label for="kelas">Kelas</label>
        <select id="kelas">
          <option value="">Sila pilih kelas</option>
          <optgroup label="Tingkatan 1">
            <option>1 AL-FARABI</option><option>1 AMANAH</option><option>1 BAKTI</option>
            <option>1 CEKAL</option><option>1 DAMAI</option><option>1 GIGIH</option>
            <option>1 HORMAT</option><option>1 IKHLAS</option><option>1 JUJUR</option>
          </optgroup>
          <optgroup label="Tingkatan 2">
            <option>2 AL-FARABI</option><option>2 AMANAH</option><option>2 BAKTI</option>
            <option>2 CEKAL</option><option>2 DAMAI</option><option>2 GIGIH</option>
            <option>2 HORMAT</option><option>2 IKHLAS</option><option>2 JUJUR</option>
          </optgroup>
          <optgroup label="Tingkatan 3">
            <option>3 AL-FARABI</option><option>3 AMANAH</option><option>3 BAKTI</option>
            <option>3 CEKAL</option><option>3 DAMAI</option><option>3 GIGIH</option>
            <option>3 HORMAT</option><option>3 IKHLAS</option><option>3 JUJUR</option>
          </optgroup>
          <optgroup label="Tingkatan 4">
            <option>4 AMANAH</option><option>4 BAKTI</option><option>4 CEKAL</option>
            <option>4 DAMAI</option><option>4 GIGIH</option><option>4 HORMAT</option>
            <option>4 IKHLAS</option><option>4 JUJUR</option><option>4 PVMA</option>
          </optgroup>
          <optgroup label="Tingkatan 5">
            <option>5 AMANAH</option><option>5 BAKTI</option><option>5 CEKAL</option>
            <option>5 DAMAI</option><option>5 GIGIH</option><option>5 HORMAT</option>
            <option>5 IKHLAS</option><option>5 JUJUR</option><option>5 PVMA</option>
          </optgroup>
        </select>
      </div>
    </div>

    <p class="section-label">Butiran Kes</p>
    <div class="form-card">
      <div class="field-row">
        <label for="tarikh">Tarikh</label>
        <input id="tarikh" type="date" />
      </div>
      <div class="field-row">
        <label for="jenis-kesalahan">Jenis Kesalahan</label>
        <select id="jenis-kesalahan">
          <option value="">Sila pilih jenis kesalahan</option>
          <option value="BARANG LARANGAN">BARANG LARANGAN</option>
          <option value="DADAH">DADAH</option>
          <option value="KEKEMASAN DIRI">KEKEMASAN DIRI</option>
          <option value="KENAKALAN">KENAKALAN</option>
          <option value="KESALAHAN ASRAMA">KESALAHAN ASRAMA</option>
          <option value="KESALAHAN SIBER">KESALAHAN SIBER</option>
          <option value="KES KHAS">KES KHAS</option>
          <option value="PENGLIBATAN POLITIK">PENGLIBATAN POLITIK</option>
          <option value="SALAH LAKU BULI">SALAH LAKU BULI</option>
          <option value="SALAH LAKU PONTENG KELAS">SALAH LAKU PONTENG KELAS</option>
          <option value="SALAH LAKU ROKOK">SALAH LAKU ROKOK</option>
          <option value="SALAH LAKU ROKOK ELEKTRONIK">SALAH LAKU ROKOK ELEKTRONIK</option>
          <option value="SALAH LAKU TELEFON BIMBIT">SALAH LAKU TELEFON BIMBIT</option>
          <option value="SALAH LAKU TIDAK AMANAH">SALAH LAKU TIDAK AMANAH</option>
          <option value="SEKSUAL">SEKSUAL</option>
          <option value="TINGKAH LAKU JENAYAH">TINGKAH LAKU JENAYAH</option>
          <option value="TINGKAH LAKU KURANG SOPAN/BIADAP">TINGKAH LAKU KURANG SOPAN/BIADAP</option>
          <option value="TINGKAH LAKU LUCAH">TINGKAH LAKU LUCAH</option>
          <option value="TINGKAH LAKU TIDAK PENTINGKAN MASA">TINGKAH LAKU TIDAK PENTINGKAN MASA</option>
          <option value="VANDALISME">VANDALISME</option>
        </select>
      </div>
      <div class="field-row">
        <label for="kategori">Kategori Kesalahan</label>
        <select id="kategori">
          <option value="">Sila pilih kategori</option>
          <option value="Berat">Berat</option>
          <option value="Sederhana">Sederhana</option>
          <option value="Ringan">Ringan</option>
        </select>
      </div>
      <div class="field-row">
        <label for="catatan">Catatan / Butiran Kes</label>
        <textarea id="catatan" rows="4" placeholder="Masukkan butiran kes..."></textarea>
      </div>
    </div>

    <!-- Save Button -->
    <button id="simpan-btn" type="button">Simpan Rekod</button>

    <!-- Progress -->
    <div id="progress-wrap" class="progress-wrap">
      <div class="progress-track">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div id="progress-text" class="progress-text">0%</div>
    </div>

    <!-- Status -->
    <div class="status-panel">
      <p id="status">Sedia untuk simpan rekod.</p>
    </div>
  </main>

  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

    const STORAGE_KEY = "mydisiplin_kes";
    const SHEET_ID = "1n3_wQUNOO1iW8mFc-etoncKfuda4Ce94pusKv6s2vRs";
    const SHEET_TAB = "Rekod kes baru";
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbz6vNSdvbA4syW5rI4kwn4PwOyZeRC43tofD9XCuCDl_LVFdZaiQarZVHXE2d4l4dnu/exec";

    const namaEl = document.getElementById("nama");
    const noKpEl = document.getElementById("nokp");
    const kelasEl = document.getElementById("kelas");
    const tarikhEl = document.getElementById("tarikh");
    const jenisKesalahanEl = document.getElementById("jenis-kesalahan");
    const kategoriEl = document.getElementById("kategori");
    const catatanEl = document.getElementById("catatan");
    const simpanBtn = document.getElementById("simpan-btn");
    const progressWrapEl = document.getElementById("progress-wrap");
    const progressBarEl = document.getElementById("progress-bar");
    const progressTextEl = document.getElementById("progress-text");
    const statusEl = document.getElementById("status");

    tarikhEl.value = new Date().toISOString().slice(0, 10);

    function normalizeKelas(value) {
      return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    }

    function applyPrefillFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const nama = (params.get("nama") || "").trim();
      const noKp = (params.get("nokp") || "").trim();
      const kelas = (params.get("kelas") || "").trim();

      if (nama) namaEl.value = nama;
      if (noKp) noKpEl.value = noKp;
      if (kelas) {
        const inputKey = normalizeKelas(kelas);
        const exactMatch = Array.from(kelasEl.options).find((o) => o.value === kelas);
        const normalizedMatch = Array.from(kelasEl.options).find((o) => normalizeKelas(o.value) === inputKey);
        const matchedOption = exactMatch || normalizedMatch;
        kelasEl.value = matchedOption ? matchedOption.value : "";
      }
    }

    applyPrefillFromQuery();

    function formatTarikhMalay(yyyyMmDd) {
      const parts = yyyyMmDd.split("-");
      if (parts.length !== 3) return new Date().toLocaleDateString("ms-MY");
      const [year, month, day] = parts.map(Number);
      if (!year || !month || !day) return new Date().toLocaleDateString("ms-MY");
      return new Date(year, month - 1, day).toLocaleDateString("ms-MY");
    }

    function getKesList() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
      catch { return []; }
    }

    function saveKesList(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    function setProgress(percent, message, type = "") {
      const safePercent = Math.max(0, Math.min(100, Number(percent) || 0));
      progressWrapEl.classList.add("visible");
      progressBarEl.style.width = `${safePercent}%`;
      progressTextEl.textContent = `${safePercent}%`;
      if (message) {
        statusEl.textContent = message;
        statusEl.className = type;
      }
    }

    function resetProgress() {
      progressWrapEl.classList.remove("visible");
      progressBarEl.style.width = "0%";
      progressTextEl.textContent = "0%";
    }

    async function sendToGoogleSheet(record) {
      if (!GAS_ENDPOINT) return { ok: false, error: "GAS_ENDPOINT belum diisi." };

      const endpointUrl = new URL(GAS_ENDPOINT);
      endpointUrl.searchParams.set("sheetId", SHEET_ID);
      endpointUrl.searchParams.set("tab", SHEET_TAB);

      const payload = { ...record, sheetId: SHEET_ID, tab: SHEET_TAB };

      try {
        const response = await fetch(endpointUrl.toString(), {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          let bodyText = "";
          try { bodyText = (await response.text()).trim(); } catch {}
          return { ok: false, error: bodyText ? `HTTP ${response.status}: ${bodyText}` : `HTTP ${response.status} ${response.statusText}` };
        }
        return { ok: true, error: "" };
      } catch (error) {
        return { ok: false, error: error?.message || "Ralat rangkaian/CORS." };
      }
    }

    simpanBtn.addEventListener("click", async () => {
      if (simpanBtn.disabled) return;
      simpanBtn.disabled = true;
      setProgress(5, "Memproses rekod...", "loading");

      const nama = namaEl.value.trim();
      const noKp = noKpEl.value.trim();
      const kelas = kelasEl.value.trim();
      const tarikh = tarikhEl.value;
      const jenisKesalahan = jenisKesalahanEl.value.trim();
      const kategori = kategoriEl.value.trim();
      const catatan = catatanEl.value.trim();

      if (!nama || !noKp || !kelas || !tarikh || !jenisKesalahan || !kategori || !catatan) {
        statusEl.textContent = "Sila lengkapkan semua maklumat sebelum menyimpan.";
        statusEl.className = "error";
        simpanBtn.disabled = false;
        resetProgress();
        return;
      }

      setProgress(25, "Menyimpan rekod tempatan...", "loading");
      const now = new Date();
      const record = {
        id: noKp,
        tarikh: formatTarikhMalay(tarikh),
        masa: now.toLocaleTimeString("ms-MY"),
        nama, noKp, kelas, jenisKesalahan, kategori, catatan,
        status: "Dalam Semakan"
      };

      const list = getKesList();
      list.unshift(record);
      saveKesList(list);

      setProgress(60, "Menghantar ke Google Sheet...", "loading");
      const syncResult = await sendToGoogleSheet(record);
      const sent = syncResult.ok;

      setProgress(90, "Memuktamadkan...", "loading");

      namaEl.value = "";
      noKpEl.value = "";
      window.myDisiplinPhotoPicker?.resetAfterSave();
      tarikhEl.value = new Date().toISOString().slice(0, 10);
      jenisKesalahanEl.selectedIndex = 0;
      catatanEl.value = "";
      kategoriEl.selectedIndex = 0;

      setProgress(100,
        sent
          ? "Rekod berjaya disimpan dan dihantar ke Google Sheet."
          : GAS_ENDPOINT
            ? `Rekod disimpan dalam aplikasi, tetapi penghantaran ke Google Sheet gagal. Sebab: ${syncResult.error || "Tidak diketahui"}.`
            : "Rekod disimpan dalam aplikasi. Sila isi URL Apps Script pada GAS_ENDPOINT.",
        sent ? "success" : "error"
      );

      setTimeout(resetProgress, 1200);
      simpanBtn.disabled = false;
    });
  </script>
  <script src="assets/student-photos.js"></script>
</body>
</html>
